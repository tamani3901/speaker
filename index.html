<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High-Speed Multi-Carrier Modem (Full RX/TX Dynamic)</title>
  <style>
    :root {
      --bg: #080c14;
      --panel: #0f172a;
      --border: #1e293b;
      --cyan: #00f0ff;
      --green: #00ff66;
      --yellow: #ffd700;
      --magenta: #ff007f;
      --red: #ff3344;
      --text: #e2e8f0;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'SF Mono', monospace; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 16px; }

    header { text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
    header h1 { font-size: 1.5rem; color: var(--cyan); letter-spacing: 1px; }

    .grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 16px; }
    @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } }

    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .card-title { font-size: 1rem; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; border-left: 4px solid var(--cyan); padding-left: 8px; }
    .card-title.rx { border-left-color: var(--green); }

    textarea { width: 100%; background: #050811; border: 1px solid #23324d; color: var(--cyan); padding: 10px; border-radius: 4px; font-size: 0.95rem; resize: vertical; }

    .btn { background: #1e293b; color: var(--text); border: 1px solid #334155; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .btn:hover { background: #334155; }
    .btn-cyan { background: #006680; border-color: var(--cyan); color: #fff; }
    .btn-green { background: #006633; border-color: var(--green); color: #fff; }
    .btn-red { background: #881122; border-color: var(--red); color: #fff; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    select, input[type="file"], input[type="number"] { background: #050811; color: #fff; border: 1px solid #23324d; padding: 6px 10px; border-radius: 4px; font-size: 0.85rem; }

    .spec-wrap { position: relative; background: #03050a; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-top: 8px; }
    canvas { display: block; width: 100%; height: 180px; }

    .squelch-box { margin-top: 8px; background: #070b14; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--border); }
    input[type="range"] { width: 100%; accent-color: var(--yellow); cursor: pointer; }

    .led { width: 10px; height: 10px; border-radius: 50%; background: #333; display: inline-block; }
    .led.open { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .led.closed { background: var(--red); }

    .out-box { background: #04060c; border: 1px solid #1a2333; padding: 8px; min-height: 50px; max-height: 90px; overflow-y: auto; border-radius: 4px; word-break: break-all; font-size: 0.85rem; margin-top: 6px; }
    .out-text { color: var(--green); }
    .out-hex { color: var(--muted); font-size: 0.75rem; }

    .img-preview { max-width: 100%; max-height: 180px; margin-top: 8px; border-radius: 4px; border: 1px solid var(--border); display: none; }
    .stats-badge { font-size: 0.75rem; background: #131d2e; padding: 4px 8px; border-radius: 3px; color: var(--cyan); }
    
    .tab-btn { padding: 4px 10px; font-size: 0.75rem; background: #162032; border: 1px solid var(--border); color: var(--text); cursor: pointer; border-radius: 4px 4px 0 0; }
    .tab-btn.active { background: var(--cyan); color: #000; font-weight: bold; }

    progress { width: 100%; height: 8px; margin-top: 6px; accent-color: var(--cyan); }
  </style>
</head>
<body>

<div class="app">
  <header>
    <h1>TURBO MULTI-CARRIER MODEM</h1>
    <p>可変キャリア（5 / 10 / 20 / 25波）+ リアルタイム多重復号エンジン</p>
  </header>

  <div class="grid">
    <!-- TX 送信機 -->
    <div class="card">
      <div class="card-title">📡 複合音 送信機 (TX)</div>
      
      <div style="display:flex; gap:4px; margin-bottom:8px;">
        <button id="tabText" class="tab-btn active">テキスト送信</button>
        <button id="tabImg" class="tab-btn">画像送信</button>
      </div>

      <div id="textModeGroup">
        <textarea id="txInput" rows="3">コンピュータ</textarea>
      </div>

      <div id="imgModeGroup" style="display:none;">
        <input type="file" id="imgInput" accept="image/*" style="width:100%;">
        <img id="txImgPreview" class="img-preview">
        <div id="imgSizeWarn" style="font-size:0.75rem; color:var(--yellow); margin-top:4px;"></div>
      </div>

      <div class="row" style="margin-top:10px;">
        <label style="font-size:0.8rem; color:var(--muted);">送信キャリア数:</label>
        <select id="txCarrierSel">
          <option value="5" selected>5波 (4 Data + 1 CLK / 1B/slot)</option>
          <option value="10">10波 (9 Data + 1 CLK / 2B/slot)</option>
          <option value="20">20波 (19 Data + 1 CLK / 4B/slot)</option>
          <option value="25">25波 (24 Data + 1 CLK / 6B/slot)</option>
        </select>
      </div>

      <div class="row">
        <label style="font-size:0.8rem; color:var(--muted);">1スロット長 (ms):</label>
        <input type="number" id="slotMsInput" value="40" min="5" max="300" style="width:70px;">
        <span style="font-size:0.75rem; color:var(--muted);"> (推奨: 20〜60ms)</span>
      </div>

      <progress id="txProgress" value="0" max="100" style="display:none;"></progress>

      <div class="row" style="margin-top:12px;">
        <button id="sendBtn" class="btn btn-cyan">▶ 音声合成 & 送信開始</button>
        <button id="stopBtn" class="btn btn-red" disabled>■ 中断</button>
      </div>
      <div style="margin-top:6px;"><span id="txStats" class="stats-badge">READY</span></div>
    </div>

    <!-- RX 受信機 -->
    <div class="card">
      <div class="card-title rx">👂 複合音 デコーダ (RX)</div>

      <div class="row">
        <label style="font-size:0.8rem; color:var(--muted);">受信キャリア数:</label>
        <select id="rxCarrierSel">
          <option value="5" selected>5波 モード</option>
          <option value="10">10波 モード</option>
          <option value="20">20波 モード</option>
          <option value="25">25波 モード</option>
        </select>
      </div>

      <div class="row" style="margin-top:6px;">
        <button id="rxBtn" class="btn btn-green">🎤 マイク受信開始</button>
        <button id="clearBtn" class="btn">クリア</button>
        <div style="display:inline-flex; align-items:center; gap:6px; margin-left:auto;">
          <div id="rxLed" class="led closed"></div>
          <span id="rxStatus" style="font-size:0.75rem; color:var(--muted);">STANDBY</span>
        </div>
      </div>

      <div class="spec-wrap">
        <canvas id="specCanvas"></canvas>
      </div>

      <div class="squelch-box">
        <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
          <span>スケルチ感度:</span>
          <span id="sqVal" style="color:var(--yellow); font-weight:bold;">100</span>
        </div>
        <input type="range" id="sqSlider" min="10" max="230" value="100">
      </div>

      <label style="font-size:0.75rem; color:var(--muted); margin-top:8px; display:block;">受信生データ (HEX):</label>
      <div id="rxHex" class="out-box out-hex">---</div>

      <label style="font-size:0.75rem; color:var(--muted); margin-top:4px; display:block;">復号結果:</label>
      <div id="rxText" class="out-box out-text"></div>
      <img id="rxImgResult" class="img-preview">
    </div>
  </div>
</div>

<script>
// ベース周波数構成（クロック: 250/350Hz, データ: 500Hz〜, 各バンド100Hz幅）
const CLK_FREQS = [250, 350];
function generateBands(count) {
  const bands = [];
  let startF = 500;
  for (let i = 0; i < count; i++) {
    bands.push([startF, startF + 40, startF + 80, startF + 120]);
    startF += 180;
  }
  return bands;
}

let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

let sendMode = 'text';
const tabText = document.getElementById('tabText');
const tabImg = document.getElementById('tabImg');
const textModeGroup = document.getElementById('textModeGroup');
const imgModeGroup = document.getElementById('imgModeGroup');

tabText.onclick = () => {
  sendMode = 'text';
  tabText.classList.add('active'); tabImg.classList.remove('active');
  textModeGroup.style.display = 'block'; imgModeGroup.style.display = 'none';
};

tabImg.onclick = () => {
  sendMode = 'image';
  tabImg.classList.add('active'); tabText.classList.remove('active');
  textModeGroup.style.display = 'none'; imgModeGroup.style.display = 'block';
};

let preparedImgDataUrl = null;
document.getElementById('imgInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  const warn = document.getElementById('imgSizeWarn');
  const preview = document.getElementById('txImgPreview');
  if (!file) return;
  warn.innerText = `ファイルサイズ: ${(file.size / 1024).toFixed(1)} KB`;
  const reader = new FileReader();
  reader.onload = (evt) => {
    preparedImgDataUrl = evt.target.result;
    preview.src = preparedImgDataUrl;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

let currentSourceNode = null;

async function generateAndTransmit() {
  const carrierCount = parseInt(document.getElementById('txCarrierSel').value);
  const dataBandCount = carrierCount - 1;
  const bands = generateBands(dataBandCount);
  const slotMs = parseInt(document.getElementById('slotMsInput').value) || 40;
  const duration = slotMs / 1000;

  let payload = sendMode === 'text' ? document.getElementById('txInput').value : preparedImgDataUrl;
  if (!payload) { alert('送信データがありません'); return; }

  const bytes = new TextEncoder().encode(payload);
  const sendBtn = document.getElementById('sendBtn');
  const stopBtn = document.getElementById('stopBtn');
  const stats = document.getElementById('txStats');
  const progress = document.getElementById('txProgress');

  sendBtn.disabled = true;
  progress.style.display = 'block';
  progress.value = 0;
  stats.innerText = `波形生成中... (${bytes.length} B)`;

  const bitsPerSlot = dataBandCount * 2;
  const bytesPerSlot = Math.floor(bitsPerSlot / 8) || 1;
  const totalSlots = Math.ceil(bytes.length / bytesPerSlot);

  const preambleTime = 0.2 + (4 * duration);
  const totalTime = preambleTime + (totalSlots * duration) + 0.1;

  const sampleRate = 44100;
  const offlineCtx = new OfflineAudioContext(1, Math.ceil(sampleRate * totalTime), sampleRate);

  let t = 0.05;

  // プリアンブル (同期確立)
  const dummyData = Array(dataBandCount).fill(0);
  addToneBundle(offlineCtx, CLK_FREQS[0], dummyData, bands, t, 0.15); t += 0.16;
  for (let p = 0; p < 4; p++) {
    addToneBundle(offlineCtx, CLK_FREQS[p % 2], dummyData, bands, t, duration);
    t += duration;
  }

  // 本データ展開
  let byteIdx = 0;
  for (let slot = 0; slot < totalSlots; slot++) {
    const clkFreq = (slot % 2 === 0) ? CLK_FREQS[0] : CLK_FREQS[1];
    const slotBands = [];

    let currentBitPos = 0;
    let tempVal = 0;
    for (let b = 0; b < dataBandCount; b++) {
      if (currentBitPos === 0 && byteIdx < bytes.length) {
        tempVal = bytes[byteIdx++];
      }
      const val2bit = (tempVal >> currentBitPos) & 0x03;
      slotBands.push(val2bit);
      currentBitPos = (currentBitPos + 2) % 8;
    }

    addToneBundle(offlineCtx, clkFreq, slotBands, bands, t, duration);
    t += duration;

    if (slot % 400 === 0) {
      progress.value = (slot / totalSlots) * 50;
      await new Promise(r => setTimeout(r, 0));
    }
  }

  stats.innerText = 'オーディオバッファ生成完了';
  const renderedBuffer = await offlineCtx.startRendering();
  progress.value = 100;

  const realCtx = getCtx();
  currentSourceNode = realCtx.createBufferSource();
  currentSourceNode.buffer = renderedBuffer;
  currentSourceNode.connect(realCtx.destination);

  stopBtn.disabled = false;
  stats.innerText = `送信中 [${carrierCount}波 / ${slotMs}ms / ${totalSlots}スロット]`;

  currentSourceNode.onended = () => {
    sendBtn.disabled = false;
    stopBtn.disabled = true;
    progress.style.display = 'none';
    stats.innerText = '送信完了';
  };

  currentSourceNode.start();
}

function addToneBundle(ctx, clkFreq, bandValues, bands, startTime, duration) {
  const masterGain = ctx.createGain();
  masterGain.gain.setValueAtTime(0.0001, startTime);
  masterGain.gain.linearRampToValueAtTime(0.12, startTime + 0.002);
  masterGain.gain.setValueAtTime(0.12, startTime + duration - 0.002);
  masterGain.gain.linearRampToValueAtTime(0.0001, startTime + duration);
  masterGain.connect(ctx.destination);

  const oscClk = ctx.createOscillator();
  oscClk.type = 'sine';
  oscClk.frequency.value = clkFreq;
  oscClk.connect(masterGain);
  oscClk.start(startTime);
  oscClk.stop(startTime + duration);

  for (let i = 0; i < bandValues.length; i++) {
    const val = bandValues[i];
    const freq = bands[i][val];
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.connect(masterGain);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }
}

document.getElementById('sendBtn').addEventListener('click', generateAndTransmit);
document.getElementById('stopBtn').addEventListener('click', () => {
  if (currentSourceNode) {
    currentSourceNode.stop();
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('txStats').innerText = '送信中断';
  }
});

// RX 受信復号処理
let rxRunning = false;
let rxStream = null;
let analyser = null;
let squelchLevel = 100;
let receivedBytes = [];

let lastClkState = null;
let lastClkChangeTime = 0;

const sqSlider = document.getElementById('sqSlider');
sqSlider.addEventListener('input', (e) => {
  squelchLevel = parseInt(e.target.value);
  document.getElementById('sqVal').innerText = squelchLevel;
});

document.getElementById('clearBtn').addEventListener('click', () => {
  receivedBytes = [];
  lastClkState = null;
  document.getElementById('rxHex').innerText = '---';
  document.getElementById('rxText').innerText = '';
  const imgRes = document.getElementById('rxImgResult');
  imgRes.style.display = 'none';
  imgRes.src = '';
});

document.getElementById('rxBtn').addEventListener('click', async () => {
  if (rxRunning) stopRx();
  else await startRx();
});

async function startRx() {
  try {
    const ctx = getCtx();
    rxStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    const src = ctx.createMediaStreamSource(rxStream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.08;
    src.connect(analyser);

    rxRunning = true;
    document.getElementById('rxBtn').innerText = '⏹ マイク受信停止';
    document.getElementById('rxBtn').className = 'btn btn-red';
    renderSpecLoop();
  } catch (err) {
    alert('マイク起動エラー: ' + err.message);
  }
}

function stopRx() {
  if (rxStream) rxStream.getTracks().forEach(t => t.stop());
  rxRunning = false;
  document.getElementById('rxBtn').innerText = '🎤 マイク受信開始';
  document.getElementById('rxBtn').className = 'btn btn-green';
  document.getElementById('rxLed').className = 'led closed';
  document.getElementById('rxStatus').innerText = 'STANDBY';
}

function renderSpecLoop() {
  const canvas = document.getElementById('specCanvas');
  const ctx2d = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx2d.scale(dpr, dpr);

  const binCount = analyser.frequencyBinCount;
  const freqData = new Uint8Array(binCount);

  function getMagAt(f) {
    const bin = Math.round(f / (audioCtx.sampleRate / analyser.fftSize));
    let m = 0;
    for (let i = Math.max(0, bin - 1); i <= Math.min(binCount - 1, bin + 1); i++) {
      if (freqData[i] > m) m = freqData[i];
    }
    return m;
  }

  function loop() {
    if (!rxRunning) return;
    requestAnimationFrame(loop);

    analyser.getByteFrequencyData(freqData);
    const w = rect.width, h = rect.height;
    const maxF = 7000;

    const carrierCount = parseInt(document.getElementById('rxCarrierSel').value);
    const dataBandCount = carrierCount - 1;
    const bands = generateBands(dataBandCount);

    ctx2d.fillStyle = '#03050a';
    ctx2d.fillRect(0, 0, w, h);

    // スペクトラム波形描画
    ctx2d.beginPath();
    ctx2d.strokeStyle = '#00f0ff';
    ctx2d.lineWidth = 1.2;
    for (let i = 0; i < binCount; i++) {
      const f = i * (audioCtx.sampleRate / analyser.fftSize);
      if (f > maxF) break;
      const x = (f / maxF) * w;
      const y = h - (freqData[i] / 255) * h;
      if (i === 0) ctx2d.moveTo(x, y); else ctx2d.lineTo(x, y);
    }
    ctx2d.stroke();

    // スケルチ線
    const sqY = h - (squelchLevel / 255) * h;
    ctx2d.strokeStyle = '#ff3344';
    ctx2d.setLineDash([4, 4]);
    ctx2d.beginPath(); ctx2d.moveTo(0, sqY); ctx2d.lineTo(w, sqY); ctx2d.stroke();
    ctx2d.setLineDash([]);

    // クロック判定
    const magClkA = getMagAt(CLK_FREQS[0]);
    const magClkB = getMagAt(CLK_FREQS[1]);
    const maxClkMag = Math.max(magClkA, magClkB);
    const clkDetected = (maxClkMag >= squelchLevel);
    const activeClkIdx = (magClkA > magClkB) ? 0 : 1;

    // データバンド判定
    const bandResults = [];
    for (let b = 0; b < dataBandCount; b++) {
      let bestIdx = 0, maxM = 0;
      for (let i = 0; i < 4; i++) {
        const m = getMagAt(bands[b][i]);
        if (m > maxM) { maxM = m; bestIdx = i; }
      }
      bandResults.push(bestIdx);
    }

    const led = document.getElementById('rxLed');
    const rxStatus = document.getElementById('rxStatus');

    if (clkDetected) {
      led.className = 'led open';
      rxStatus.innerText = `SYNC LOCK (${carrierCount}波 / CLK ${activeClkIdx === 0 ? 'A' : 'B'})`;
      rxStatus.style.color = 'var(--green)';

      const now = performance.now();
      // クロックのトグル（反転）検知でマルチビット復号実行
      if (lastClkState !== null && lastClkState !== activeClkIdx && (now - lastClkChangeTime > 8)) {
        
        let bitBuffer = 0;
        let bitsInBuf = 0;

        for (let b = 0; b < dataBandCount; b++) {
          const val2bit = bandResults[b];
          bitBuffer |= (val2bit << bitsInBuf);
          bitsInBuf += 2;

          while (bitsInBuf >= 8) {
            const extractedByte = bitBuffer & 0xFF;
            onByteReceived(extractedByte);
            bitBuffer >>= 8;
            bitsInBuf -= 8;
          }
        }
        
        lastClkChangeTime = now;
      }
      lastClkState = activeClkIdx;
    } else {
      led.className = 'led closed';
      rxStatus.innerText = 'SQUELCH CLOSED';
      rxStatus.style.color = 'var(--muted)';
      lastClkState = null;
    }
  }
  loop();
}

function onByteReceived(b) {
  receivedBytes.push(b);
  const hexStr = receivedBytes.slice(-30).map(x => x.toString(16).padStart(2, '0').toUpperCase()).join(' ');
  document.getElementById('rxHex').innerText = `[Total: ${receivedBytes.length}B] ${hexStr}`;

  try {
    const decodedStr = new TextDecoder('utf-8', { fatal: false }).decode(new Uint8Array(receivedBytes));
    if (decodedStr.startsWith('data:image/')) {
      document.getElementById('rxText').innerText = '[画像データ受信中 / 完了]';
      const imgRes = document.getElementById('rxImgResult');
      imgRes.src = decodedStr;
      imgRes.style.display = 'block';
    } else {
      document.getElementById('rxText').innerText = decodedStr;
    }
  } catch (e) {
    console.warn(e);
  }
}
</script>
</body>
</html>
