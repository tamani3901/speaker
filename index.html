<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>音階音響通信 (モード分離版)</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 15px; background: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    textarea { width: 100%; height: 60px; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; }
    button { padding: 12px 20px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; background: #28a745; color: white; margin-right: 8px; }
    button:disabled { background: #ccc; }
    select { padding: 10px; font-size: 15px; border-radius: 6px; margin-bottom: 10px; }
    .status { margin-top: 10px; font-size: 14px; color: #d9534f; font-weight: bold; }
    .result { font-size: 26px; font-weight: bold; color: #007bff; padding: 12px; background: #e8f4ff; border-radius: 6px; min-height: 36px; word-break: break-all; margin-top: 10px; text-align: center;}
    .log { font-family: monospace; font-size: 11px; color: #333; background: #eee; padding: 8px; border-radius: 4px; margin-top: 10px; height: 160px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h2>🎵 音階音響通信</h2>

  <div class="card">
    <h3>1. 送信</h3>
    <label>送信モード: </label>
    <select id="txModeSelect">
      <option value="fast">⚡ 高速モード (45ms / 単一送信)</option>
      <option value="accurate">🛡️ 正確モード (100ms / 3回重複)</option>
    </select>
    <textarea id="inputText" placeholder="文字列を入力">Hello</textarea>
    <div>
      <button id="btnPlay">音で送信</button>
    </div>
  </div>

  <div class="card">
    <h3>2. 受信</h3>
    <label>受信モード: </label>
    <select id="rxModeSelect">
      <option value="fast">⚡ 高速モード (45ms用)</option>
      <option value="accurate">🛡️ 正確モード (100ms用)</option>
    </select>
    <br><br>
    <button id="btnListen" style="background:#007bff;">マイクで受信開始</button>
    <div id="status" class="status">待機中</div>
    <div id="outputText" class="result">---</div>
    <div id="log" class="log">ログがここに表示されます</div>
  </div>

<script>
const FREQ_0  = 523.25; // ド
const FREQ_1  = 659.25; // ミ
const FREQ_ST = 783.99; // ソ

let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += "\n" + msg;
  el.scrollTop = el.scrollHeight;
}

function encodeHamming(d4) {
  const d = [(d4>>3)&1, (d4>>2)&1, (d4>>1)&1, d4&1];
  const p1 = d[0] ^ d[1] ^ d[3];
  const p2 = d[0] ^ d[2] ^ d[3];
  const p3 = d[1] ^ d[2] ^ d[3];
  return (d[0]<<6)|(d[1]<<5)|(d[2]<<4)|(d[3]<<3)|(p1<<2)|(p2<<1)|p3;
}

function decodeHamming(c7) {
  const b = [];
  for (let i = 6; i >= 0; i--) b.push((c7 >> i) & 1);
  const s1 = b[0] ^ b[1] ^ b[3] ^ b[4];
  const s2 = b[0] ^ b[2] ^ b[3] ^ b[5];
  const s3 = b[1] ^ b[2] ^ b[3] ^ b[6];
  const err = (s1 << 2) | (s2 << 1) | s3;
  if (err >= 1 && err <= 7) b[err - 1] ^= 1;
  return (b[0]<<3) | (b[1]<<2) | (b[2]<<1) | b[3];
}

function encodeByteTo14Bits(byteVal) {
  const high = encodeHamming((byteVal >> 4) & 0x0F);
  const low  = encodeHamming(byteVal & 0x0F);
  let bits = [];
  for (let i = 6; i >= 0; i--) bits.push((high >> i) & 1);
  for (let i = 6; i >= 0; i--) bits.push((low >> i) & 1);
  return bits;
}

function buildBits(text, isFast) {
  const bytes = new TextEncoder().encode(text);
  let rawBits = [];  
  
  // 文字数のみをヘッダとして入れる (1byte = 14bits)
  rawBits.push(...encodeByteTo14Bits(bytes.length & 0xFF));

  for (let b of bytes) {
    rawBits.push(...encodeByteTo14Bits(b));
  }

  if (isFast) return rawBits;

  // 正確モードなら3回重複
  let expanded = [];
  for (let bit of rawBits) {
    expanded.push(bit, bit, bit);
  }
  return expanded;
}

// 送信処理
document.getElementById('btnPlay').onclick = () => {
  const ctx = getCtx();
  const text = document.getElementById('inputText').value;
  const isFast = document.getElementById('txModeSelect').value === 'fast';
  if (!text) return;
  
  const bits = buildBits(text, isFast);
  const tBit = isFast ? 0.045 : 0.100;
  const now = ctx.currentTime + 0.1;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);

  // パイロット音 (ソ: 300ms)
  osc.frequency.setValueAtTime(FREQ_ST, now);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.2, now + 0.02);

  // FSKデータ送信
  let t = now + 0.300; 
  bits.forEach((bit) => {
    osc.frequency.setValueAtTime(bit === 1 ? FREQ_1 : FREQ_0, t);
    t += tBit;
  });

  gain.gain.setValueAtTime(0.2, t - 0.02);
  gain.gain.linearRampToValueAtTime(0, t);

  osc.start(now);
  osc.stop(t);
};

// 受信処理
document.getElementById('btnListen').onclick = async () => {
  const btn = document.getElementById('btnListen');
  const status = document.getElementById('status');
  const isFastMode = document.getElementById('rxModeSelect').value === 'fast';

  document.getElementById('log').textContent = `--- ログ開始 (${isFastMode ? "高速" : "正確"}モード) ---`;
  document.getElementById('outputText').textContent = "---";
  
  btn.disabled = true;
  status.textContent = "👂 スタート音(ソ)待機中...";

  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  });
  
  const ctx = getCtx();
  const source = ctx.createMediaStreamSource(stream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  source.connect(analyser);

  const binSize = ctx.sampleRate / analyser.fftSize;
  const b0  = Math.round(FREQ_0 / binSize);
  const b1  = Math.round(FREQ_1 / binSize);
  const bST = Math.round(FREQ_ST / binSize);

  const data = new Uint8Array(analyser.frequencyBinCount);
  
  let isRecording = false;
  let audioBuffer = [];
  let silentCount = 0;
  const intervalMs = 10;
  
  const loop = setInterval(() => {
    analyser.getByteFrequencyData(data);
    const valST = data[bST];
    const val0  = data[b0];
    const val1  = data[b1];

    if (!isRecording && valST > 60) {
      isRecording = true;
      status.textContent = "🎙️ 信号録音中...";
      log("スタート音検出。録音開始...");
    }

    if (isRecording) {
      audioBuffer.push({ t: Date.now(), b0: val0, b1: val1, bST: valST });

      if (val0 < 30 && val1 < 30 && valST < 30) {
        silentCount++;
      } else {
        silentCount = 0;
      }

      // 無音が300ms続いたら解析開始
      if (audioBuffer.length > 20 && silentCount > 30) {
        clearInterval(loop);
        stream.getTracks().forEach(t => t.stop());
        btn.disabled = false;
        status.textContent = "⚙️ 解析中...";
        log(`録音完了 (${audioBuffer.length * intervalMs}ms)`);
        
        parseBuffer(audioBuffer, isFastMode);
      }
    }
  }, intervalMs);
};

// 一括解析関数
function parseBuffer(buffer, isFastMode) {
  const tBitMs = isFastMode ? 45 : 100;
  const repeatCount = isFastMode ? 1 : 3;

  // データ開始位置（ソが消えてド/ミが始まった場所）を特定
  let dataStartIndex = -1;
  for (let i = 0; i < buffer.length - 3; i++) {
    if (buffer[i].bST < 40 && (buffer[i].b0 > 40 || buffer[i].b1 > 40)) {
      dataStartIndex = i;
      break;
    }
  }

  if (dataStartIndex === -1) {
    log("エラー: 信号の開始位置が見つかりません");
    document.getElementById('status').textContent = "❌ 解析失敗";
    return;
  }

  const startTime = buffer[dataStartIndex].t;
  log(`データ開始点を検出: +${dataStartIndex * 10}ms`);

  // ビットサンプリング
  let rawBits = [];
  let sampleIndex = 0;
  while (true) {
    const sampleT = startTime + (sampleIndex + 0.5) * tBitMs;
    const item = buffer.find(b => b.t >= sampleT);
    if (!item) break;
    
    rawBits.push(item.b1 > item.b0 ? 1 : 0);
    sampleIndex++;
  }

  log(`取得ビット数: ${rawBits.length} bit`);
  decodeStream(rawBits, repeatCount);
}

function decodeBitsToByte(rawBits, repeatCount) {
  let votedBits = [];
  if (repeatCount === 3) {
    for (let i = 0; i < rawBits.length; i += 3) {
      const sum = (rawBits[i]||0) + (rawBits[i+1]||0) + (rawBits[i+2]||0);
      votedBits.push(sum >= 2 ? 1 : 0);
    }
  } else {
    votedBits = rawBits;
  }
  const highCode = votedBits.slice(0, 7).reduce((acc, b) => (acc << 1) | b, 0);
  const lowCode  = votedBits.slice(7, 14).reduce((acc, b) => (acc << 1) | b, 0);
  return (decodeHamming(highCode) << 4) | decodeHamming(lowCode);
}

function decodeStream(raw, repeatCount) {
  const output = document.getElementById('outputText');
  const status = document.getElementById('status');
  const bitsPerChar = 14 * repeatCount;
  
  if (raw.length < bitsPerChar) {
    output.textContent = "データ不足";
    status.textContent = "❌ 受信失敗";
    return;
  }

  // 先頭14ビット（または14×3ビット）を文字数ヘッダとしてデコード
  const lengthByte = decodeBitsToByte(raw.slice(0, bitsPerChar), repeatCount);
  log(`ヘッダ解析結果: 文字数 = ${lengthByte}`);

  let bytes = [];
  for (let c = 0; c < lengthByte; c++) {
    const offset = (1 + c) * bitsPerChar;
    const charRaw = raw.slice(offset, offset + bitsPerChar);
    if (charRaw.length < bitsPerChar) break;
    bytes.push(decodeBitsToByte(charRaw, repeatCount));
  }

  try {
    const text = new TextDecoder().decode(new Uint8Array(bytes));
    log(`復元成功: "${text}"`);
    output.textContent = text || "復元失敗";
    status.textContent = "✅ 受信完了";
  } catch(e) {
    output.textContent = "デコードエラー";
    status.textContent = "❌ デコード失敗";
  }
}
</script>
</body>
</html>
