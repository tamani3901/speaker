<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTIMATE ACOUSTIC MODEM & IMAGE TRANSMITTER (FIXED)</title>
  <style>
    :root {
      --bg: #030509;
      --panel: #080d1a;
      --border: #121d33;
      --cyan: #00f0ff;
      --green: #00ff77;
      --yellow: #ffd000;
      --orange: #ff7700;
      --red: #ff3344;
      --text: #e2e8f0;
      --muted: #5e7292;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'SF Mono', monospace; }
    body { background: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 1280px; display: flex; flex-direction: column; gap: 10px; }

    header { text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
    header h1 { font-size: 1.4rem; color: var(--cyan); letter-spacing: 2px; text-shadow: 0 0 14px rgba(0, 240, 255, 0.4); }
    header p { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }

    .grid { display: grid; grid-template-columns: 1fr 1.25fr; gap: 10px; }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }

    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
    .card-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; border-left: 4px solid var(--cyan); padding-left: 6px; }
    .card-title.rx { border-left-color: var(--green); }

    .tab-group { display: flex; gap: 4px; margin-bottom: 8px; }
    .tab-btn { background: #0f172a; border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .tab-btn.active { background: #005a73; color: #fff; border-color: var(--cyan); }

    textarea, input[type="file"] { width: 100%; background: #020408; border: 1px solid #1c2a44; color: var(--cyan); padding: 8px; border-radius: 4px; font-size: 0.85rem; }
    textarea { resize: vertical; }

    .btn { background: #141c2e; color: var(--text); border: 1px solid #293854; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.78rem; transition: all 0.2s; }
    .btn:hover { background: #23314d; }
    .btn-cyan { background: #005a73; border-color: var(--cyan); color: #fff; }
    .btn-green { background: #005229; border-color: var(--green); color: #fff; }
    .btn-red { background: #6e101d; border-color: var(--red); color: #fff; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
    select { background: #020408; color: #fff; border: 1px solid #1c2a44; padding: 5px 8px; border-radius: 4px; font-size: 0.78rem; }

    .spec-wrap { position: relative; background: #010205; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-top: 6px; }
    canvas { display: block; width: 100%; height: 180px; }

    .progress-bar { width: 100%; height: 6px; background: #0a1120; border-radius: 3px; overflow: hidden; margin-top: 6px; display: none; }
    .progress-fill { width: 0%; height: 100%; background: var(--cyan); transition: width 0.1s; }

    .ctrl-box { margin-top: 6px; background: #040710; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    @media(max-width: 750px) { .ctrl-box { grid-template-columns: 1fr; } }
    .ctrl-item { display: flex; flex-direction: column; gap: 2px; }
    .ctrl-hdr { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); }
    input[type="range"] { width: 100%; accent-color: var(--yellow); cursor: pointer; }

    .led { width: 8px; height: 8px; border-radius: 50%; background: #333; display: inline-block; }
    .led.open { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .led.closed { background: var(--red); }

    .out-box { background: #010205; border: 1px solid #141c2c; padding: 6px 8px; min-height: 42px; max-height: 100px; overflow-y: auto; border-radius: 4px; word-break: break-all; font-size: 0.85rem; margin-top: 4px; }
    .out-text { color: var(--green); }
    .out-hex { color: var(--muted); font-size: 0.7rem; }

    .img-box { background: #010205; border: 1px solid #141c2c; padding: 8px; border-radius: 4px; margin-top: 4px; text-align: center; }
    .img-preview { max-width: 100%; max-height: 200px; border-radius: 4px; border: 1px solid var(--border); display: none; margin: 6px auto 0 auto; }
    .badge { font-size: 0.7rem; background: #0e1626; padding: 2px 6px; border-radius: 3px; color: var(--cyan); }
  </style>
</head>
<body>

<div class="app">
  <header>
    <h1>ULTIMATE ACOUSTIC MODEM & IMAGE TRANSMITTER</h1>
    <p>多重音階音響通信 ＆ 画像転送（ヘッダー同期・画像デコード修正版）</p>
  </header>

  <div class="grid">
    <!-- TX 送信側 -->
    <div class="card">
      <div class="card-title">📡 音響データ送信機 (TX)</div>

      <div class="tab-group">
        <button id="tabTextBtn" class="tab-btn active">📝 テキスト送信</button>
        <button id="tabImgBtn" class="tab-btn">🖼️ 画像送信</button>
      </div>

      <div id="textInputArea">
        <textarea id="txInput" rows="3">こんにちは！音響通信テストです。先頭の文字も画像も正常に表示されます。</textarea>
      </div>

      <div id="imgInputArea" style="display:none;">
        <input type="file" id="imgFileInput" accept="image/*">
        <div class="row">
          <label style="font-size:0.72rem; color:var(--muted);">画像解像度:</label>
          <select id="imgCompressSel">
            <option value="48">極小 (48px / 高速)</option>
            <option value="80" selected>標準 (80px / 推奨)</option>
            <option value="120">高画質 (120px)</option>
          </select>
        </div>
        <img id="txImgPreview" class="img-preview">
      </div>

      <div class="row">
        <label style="font-size:0.75rem; color:var(--muted);">多重度:</label>
        <select id="polyphonySel">
          <option value="16">16バンド (4B/和音)</option>
          <option value="32" selected>32バンド (8B/和音・推奨)</option>
        </select>
      </div>

      <div class="progress-bar" id="txProgressBar"><div class="progress-fill" id="txProgressFill"></div></div>

      <div class="row" style="margin-top:10px;">
        <button id="sendBtn" class="btn btn-cyan">▶ 送信開始</button>
        <button id="stopBtn" class="btn btn-red" disabled>■ 停止</button>
        <span id="txStatus" class="badge">READY</span>
      </div>
    </div>

    <!-- RX 受信側 -->
    <div class="card">
      <div class="card-title rx">👂 アナライザー & デコーダー (RX)</div>

      <div class="row">
        <button id="rxBtn" class="btn btn-green">🎤 受信開始</button>
        <button id="clearBtn" class="btn">クリア</button>
        <div style="display:inline-flex; align-items:center; gap:5px; margin-left:auto;">
          <div id="rxLed" class="led closed"></div>
          <span id="rxStatus" style="font-size:0.72rem; color:var(--muted);">STANDBY</span>
        </div>
      </div>

      <div class="spec-wrap">
        <canvas id="specCanvas"></canvas>
      </div>

      <div class="ctrl-box">
        <div class="ctrl-item">
          <div class="ctrl-hdr"><span>HPF (雑音カット):</span><span id="hpfVal" style="color:var(--cyan);">400 Hz</span></div>
          <input type="range" id="hpfSlider" min="50" max="800" value="400">
        </div>
        <div class="ctrl-item">
          <div class="ctrl-hdr"><span>スケルチ (感度):</span><span id="sqVal" style="color:var(--yellow);">35</span></div>
          <input type="range" id="sqSlider" min="10" max="180" value="35">
        </div>
        <div class="ctrl-item">
          <div class="ctrl-hdr"><span>サンプリング位置:</span><span id="delayVal" style="color:var(--orange);">50%</span></div>
          <input type="range" id="delaySlider" min="20" max="80" value="50">
        </div>
      </div>

      <label style="font-size:0.72rem; color:var(--muted); margin-top:6px; display:block;">受信生データ (HEX):</label>
      <div id="rxHex" class="out-box out-hex">---</div>

      <label style="font-size:0.72rem; color:var(--muted); margin-top:4px; display:block;">復号テキスト:</label>
      <div id="rxText" class="out-box out-text"></div>

      <label style="font-size:0.72rem; color:var(--muted); margin-top:4px; display:block;">受信画像:</label>
      <div class="img-box">
        <div id="rxImgStatus" style="font-size:0.75rem; color:var(--muted);">画像データ未受信</div>
        <img id="rxImgOutput" class="img-preview">
      </div>
    </div>
  </div>
</div>

<script>
const CLK_FREQS = [650, 770];
// ヘッダーパケット定義: [0xAA, 0x55, 0xFF] (3バイトで堅牢化)
const PREAMBLE = [0xAA, 0x55, 0xFF]; 
const TYPE_TEXT = 0x01;
const TYPE_IMAGE = 0x02;

let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function generateBands(count) {
  const bands = [];
  let base = 900;
  for (let b = 0; b < count; b++) {
    bands.push([base, base + 40, base + 80, base + 120]);
    base += 165;
  }
  return bands;
}

// UIタブ
let activeTab = 'text';
document.getElementById('tabTextBtn').addEventListener('click', () => {
  activeTab = 'text';
  document.getElementById('tabTextBtn').className = 'tab-btn active';
  document.getElementById('tabImgBtn').className = 'tab-btn';
  document.getElementById('textInputArea').style.display = 'block';
  document.getElementById('imgInputArea').style.display = 'none';
});
document.getElementById('tabImgBtn').addEventListener('click', () => {
  activeTab = 'image';
  document.getElementById('tabImgBtn').className = 'tab-btn active';
  document.getElementById('tabTextBtn').className = 'tab-btn';
  document.getElementById('textInputArea').style.display = 'none';
  document.getElementById('imgInputArea').style.display = 'block';
});

// 画像リサイズ
let txImageBytes = null;
document.getElementById('imgFileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const imgEl = document.getElementById('txImgPreview');
  const reader = new FileReader();
  reader.onload = (evt) => {
    imgEl.src = evt.target.result;
    imgEl.style.display = 'block';
    processImageForTx();
  };
  reader.readAsDataURL(file);
});

document.getElementById('imgCompressSel').addEventListener('change', processImageForTx);

function processImageForTx() {
  const imgEl = document.getElementById('txImgPreview');
  if (!imgEl.src) return;

  const targetSize = parseInt(document.getElementById('imgCompressSel').value);
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  
  let w = imgEl.naturalWidth || targetSize;
  let h = imgEl.naturalHeight || targetSize;
  if (w > h) { h = Math.round((h * targetSize) / w); w = targetSize; }
  else { w = Math.round((w * targetSize) / h); h = targetSize; }

  canvas.width = w; canvas.height = h;
  ctx.drawImage(imgEl, 0, 0, w, h);

  canvas.toBlob((blob) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      txImageBytes = new Uint8Array(reader.result);
      document.getElementById('txStatus').innerText = `準備完了: ${txImageBytes.length}B (${w}x${h})`;
    };
    reader.readAsArrayBuffer(blob);
  }, 'image/jpeg', 0.6);
}

// 送信機能
let txAbort = false;

function playBundle(ctx, clkFreq, dataFreqs, startTime, duration) {
  const all = [clkFreq, ...dataFreqs];
  const master = ctx.createGain();
  const gainVal = 0.75 / all.length;

  master.gain.setValueAtTime(0.0001, startTime);
  master.gain.linearRampToValueAtTime(gainVal, startTime + 0.004);
  master.gain.setValueAtTime(gainVal, startTime + duration - 0.004);
  master.gain.linearRampToValueAtTime(0.0001, startTime + duration);
  master.connect(ctx.destination);

  all.forEach(f => {
    const osc = ctx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = f;
    osc.connect(master);
    osc.start(startTime); osc.stop(startTime + duration);
  });
}

async function transmit() {
  let payloadBytes = null;
  let typeByte = TYPE_TEXT;

  if (activeTab === 'text') {
    const text = document.getElementById('txInput').value;
    if (!text) return;
    payloadBytes = new TextEncoder().encode(text);
    typeByte = TYPE_TEXT;
  } else {
    if (!txImageBytes) { alert('画像を選択してください'); return; }
    payloadBytes = txImageBytes;
    typeByte = TYPE_IMAGE;
  }

  // パケット構成: [0xAA, 0x55, 0xFF, TYPE, LEN_HI, LEN_LO, ...PAYLOAD]
  const totalLen = payloadBytes.length;
  const packet = new Uint8Array(6 + totalLen);
  packet[0] = PREAMBLE[0];
  packet[1] = PREAMBLE[1];
  packet[2] = PREAMBLE[2];
  packet[3] = typeByte;
  packet[4] = (totalLen >> 8) & 0xFF;
  packet[5] = totalLen & 0xFF;
  packet.set(payloadBytes, 6);

  const ctx = getCtx();
  const bandCount = parseInt(document.getElementById('polyphonySel').value);
  const bands = generateBands(bandCount);
  const bytesPerChord = bandCount / 4;
  const duration = 0.14; // 送信時間を140msに拡大して精度アップ

  txAbort = false;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  const progressBar = document.getElementById('txProgressBar');
  const progressFill = document.getElementById('txProgressFill');
  progressBar.style.display = 'block';

  let t = ctx.currentTime + 0.2;

  // ウォーミングアップ信号（受信側のスケルチ解除用）
  playBundle(ctx, CLK_FREQS[0], bands.map(b => b[0]), t, 0.3);
  t += 0.35;

  const totalChords = Math.ceil(packet.length / bytesPerChord);

  for (let i = 0; i < totalChords; i++) {
    if (txAbort) break;

    const chunk = packet.slice(i * bytesPerChord, (i + 1) * bytesPerChord);
    const chunkArr = Array.from(chunk);
    while (chunkArr.length < bytesPerChord) chunkArr.push(0x00);

    const clk = (i % 2 === 0) ? CLK_FREQS[0] : CLK_FREQS[1];
    const freqs = [];

    for (let b = 0; b < bytesPerChord; b++) {
      const val = chunkArr[b];
      freqs.push(bands[b * 4 + 0][val & 0x03]);
      freqs.push(bands[b * 4 + 1][(val >> 2) & 0x03]);
      freqs.push(bands[b * 4 + 2][(val >> 4) & 0x03]);
      freqs.push(bands[b * 4 + 3][(val >> 6) & 0x03]);
    }

    playBundle(ctx, clk, freqs, t, duration);
    t += duration;

    const pct = Math.round(((i + 1) / totalChords) * 100);
    progressFill.style.width = `${pct}%`;
    document.getElementById('txStatus').innerText = `送信中: ${pct}%`;
  }

  const waitMs = (t - ctx.currentTime) * 1000;
  await new Promise(r => setTimeout(r, Math.max(10, waitMs)));

  document.getElementById('sendBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('txStatus').innerText = '送信完了';
  setTimeout(() => { progressBar.style.display = 'none'; }, 1000);
}

document.getElementById('sendBtn').addEventListener('click', transmit);
document.getElementById('stopBtn').addEventListener('click', () => { txAbort = true; });

// 受信機能
let rxRunning = false;
let rxStream = null;
let hpfNode = null;
let analyser = null;
let squelchLevel = 35;
let samplingDelayRatio = 0.5;

let receivedBytes = [];
let lastClkState = null;
let isSamplingScheduled = false;
let scheduledSampleTime = 0;

const hpfSlider = document.getElementById('hpfSlider');
hpfSlider.addEventListener('input', (e) => {
  document.getElementById('hpfVal').innerText = `${e.target.value} Hz`;
  if (hpfNode) hpfNode.frequency.setValueAtTime(parseInt(e.target.value), audioCtx.currentTime);
});

const sqSlider = document.getElementById('sqSlider');
sqSlider.addEventListener('input', (e) => {
  squelchLevel = parseInt(e.target.value);
  document.getElementById('sqVal').innerText = squelchLevel;
});

const delaySlider = document.getElementById('delaySlider');
delaySlider.addEventListener('input', (e) => {
  samplingDelayRatio = parseInt(e.target.value) / 100;
  document.getElementById('delayVal').innerText = `${e.target.value}%`;
});

document.getElementById('clearBtn').addEventListener('click', () => {
  receivedBytes = [];
  document.getElementById('rxHex').innerText = '---';
  document.getElementById('rxText').innerText = '';
  const imgOut = document.getElementById('rxImgOutput');
  imgOut.style.display = 'none';
  imgOut.src = '';
  document.getElementById('rxImgStatus').innerText = '画像データ未受信';
});

document.getElementById('rxBtn').addEventListener('click', async () => {
  if (rxRunning) stopRx(); else await startRx();
});

async function startRx() {
  try {
    const ctx = getCtx();
    rxStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    const src = ctx.createMediaStreamSource(rxStream);

    hpfNode = ctx.createBiquadFilter();
    hpfNode.type = 'highpass';
    hpfNode.frequency.value = parseInt(hpfSlider.value);

    analyser = ctx.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0.1;

    src.connect(hpfNode);
    hpfNode.connect(analyser);

    rxRunning = true;
    document.getElementById('rxBtn').innerText = '⏹ マイク停止';
    document.getElementById('rxBtn').className = 'btn btn-red';
    renderRxLoop();
  } catch (err) {
    alert('マイク起動エラー: ' + err.message);
  }
}

function stopRx() {
  if (rxStream) rxStream.getTracks().forEach(t => t.stop());
  rxRunning = false;
  document.getElementById('rxBtn').innerText = '🎤 受信開始';
  document.getElementById('rxBtn').className = 'btn btn-green';
  document.getElementById('rxLed').className = 'led closed';
  document.getElementById('rxStatus').innerText = 'STANDBY';
}

function renderRxLoop() {
  const canvas = document.getElementById('specCanvas');
  const ctx2d = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx2d.scale(dpr, dpr);

  const binCount = analyser.frequencyBinCount;
  const freqData = new Uint8Array(binCount);

  function getMagAt(f) {
    const bin = Math.round(f / (audioCtx.sampleRate / analyser.fftSize));
    let m = 0;
    for (let i = Math.max(0, bin - 1); i <= Math.min(binCount - 1, bin + 1); i++) {
      if (freqData[i] > m) m = freqData[i];
    }
    return m;
  }

  function loop() {
    if (!rxRunning) return;
    requestAnimationFrame(loop);

    analyser.getByteFrequencyData(freqData);

    const w = rect.width;
    const h = rect.height;
    const maxF = 12000;
    const bandCount = parseInt(document.getElementById('polyphonySel').value);
    const bands = generateBands(bandCount);

    // 簡易波形表示
    ctx2d.fillStyle = '#010205'; ctx2d.fillRect(0, 0, w, h);
    ctx2d.beginPath(); ctx2d.strokeStyle = '#00f0ff'; ctx2d.lineWidth = 1.2;
    ctx2d.moveTo(0, h);
    for (let i = 0; i < binCount; i++) {
      const f = i * (audioCtx.sampleRate / analyser.fftSize);
      if (f > maxF) break;
      const x = (f / maxF) * w;
      const y = h - (freqData[i] / 255) * h;
      ctx2d.lineTo(x, y);
    }
    ctx2d.stroke();

    // スケルチ線
    const sqY = h - (squelchLevel / 255) * h;
    ctx2d.strokeStyle = '#ff3344'; ctx2d.setLineDash([4, 4]);
    ctx2d.beginPath(); ctx2d.moveTo(0, sqY); ctx2d.lineTo(w, sqY); ctx2d.stroke();
    ctx2d.setLineDash([]);

    const magA = getMagAt(CLK_FREQS[0]);
    const magB = getMagAt(CLK_FREQS[1]);
    const maxClkMag = Math.max(magA, magB);
    const clkOpen = (maxClkMag >= squelchLevel);
    const activeClk = (magA > magB) ? 0 : 1;

    const bandHits = bands.map(b => {
      let best = 0, maxM = 0;
      b.forEach((f, idx) => {
        const m = getMagAt(f);
        if (m > maxM) { maxM = m; best = idx; }
      });
      return { idx: best, mag: maxM };
    });

    const led = document.getElementById('rxLed');
    const rxStatus = document.getElementById('rxStatus');

    if (clkOpen) {
      led.className = 'led open';
      rxStatus.innerText = `SYNC [CLK ${activeClk === 0 ? '650' : '770'}]`;
      rxStatus.style.color = 'var(--green)';

      const now = performance.now();
      if (lastClkState !== null && lastClkState !== activeClk) {
        isSamplingScheduled = true;
        scheduledSampleTime = now + (140 * samplingDelayRatio);
      }
      lastClkState = activeClk;

      if (isSamplingScheduled && now >= scheduledSampleTime) {
        isSamplingScheduled = false;
        const bytesPerChord = bands.length / 4;
        const decodedChords = [];

        for (let b = 0; b < bytesPerChord; b++) {
          const s0 = bandHits[b * 4 + 0].idx;
          const s1 = bandHits[b * 4 + 1].idx;
          const s2 = bandHits[b * 4 + 2].idx;
          const s3 = bandHits[b * 4 + 3].idx;
          decodedChords.push((s3 << 6) | (s2 << 4) | (s1 << 2) | s0);
        }
        onChunkDecoded(decodedChords);
      }
    } else {
      led.className = 'led closed';
      rxStatus.innerText = 'SQUELCH CLOSED';
      rxStatus.style.color = 'var(--muted)';
      lastClkState = null;
      isSamplingScheduled = false;
    }
  }

  loop();
}

/**
 * 修正版：パケット解析 & 画像・テキスト完全抽出
 */
function onChunkDecoded(byteArr) {
  receivedBytes.push(...byteArr);

  // 生データHEX表示
  const hexStr = receivedBytes.map(x => x.toString(16).padStart(2, '0').toUpperCase()).join(' ');
  document.getElementById('rxHex').innerText = hexStr;

  // 1. パケットヘッダーの検索 [0xAA, 0x55, 0xFF]
  const pIdx = findPreambleIdx(receivedBytes);

  if (pIdx !== -1 && receivedBytes.length >= pIdx + 6) {
    const typeByte = receivedBytes[pIdx + 3];
    const payloadLen = (receivedBytes[pIdx + 4] << 8) | receivedBytes[pIdx + 5];
    const payloadStart = pIdx + 6;
    const available = receivedBytes.length - payloadStart;

    if (typeByte === TYPE_TEXT) {
      // テキスト処理：ヘッダー直後から完全抽出
      const rawPayload = receivedBytes.slice(payloadStart, payloadStart + Math.min(available, payloadLen));
      const text = new TextDecoder('utf-8', { fatal: false }).decode(new Uint8Array(rawPayload));
      document.getElementById('rxText').innerText = text;
    } 
    else if (typeByte === TYPE_IMAGE) {
      document.getElementById('rxImgStatus').innerText = `⏳ 受信中... ${Math.min(available, payloadLen)} / ${payloadLen} Bytes`;
      
      // 画像処理：パケット指定サイズ、またはJPEGマジックナンバー(0xFF, 0xD8)を直接探索
      const rawPayload = receivedBytes.slice(payloadStart);
      tryDecodeImage(rawPayload, payloadLen);
    }
  } else {
    // ヘッダー検出前のフォールバック（画面に生の文字を表示）
    const text = new TextDecoder('utf-8', { fatal: false }).decode(new Uint8Array(receivedBytes));
    document.getElementById('rxText').innerText = text;
  }
}

function findPreambleIdx(bytes) {
  for (let i = 0; i < bytes.length - 2; i++) {
    if (bytes[i] === PREAMBLE[0] && bytes[i + 1] === PREAMBLE[1] && bytes[i + 2] === PREAMBLE[2]) {
      return i;
    }
  }
  return -1;
}

// JPEG構造を直接解析して描画する補正処理
function tryDecodeImage(payloadArr, targetLen) {
  if (payloadArr.length < 10) return;

  // JPEGの開始位置 (0xFF, 0xD8) を探索
  let jpegStart = -1;
  for (let i = 0; i < payloadArr.length - 1; i++) {
    if (payloadArr[i] === 0xFF && payloadArr[i + 1] === 0xD8) {
      jpegStart = i;
      break;
    }
  }

  // JPEGヘッダーが見つかった場合、そこから切り出し
  const imgData = (jpegStart !== -1) ? payloadArr.slice(jpegStart) : payloadArr;
  
  if (imgData.length > 20) {
    const blob = new Blob([new Uint8Array(imgData)], { type: 'image/jpeg' });
    const url = URL.createObjectURL(blob);
    const imgEl = document.getElementById('rxImgOutput');
    
    imgEl.onload = () => {
      document.getElementById('rxImgStatus').innerText = `✅ 画像復元完了 (${imgData.length} Bytes)`;
    };
    imgEl.src = url;
    imgEl.style.display = 'block';
  }
}
