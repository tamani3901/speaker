<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>音階音響通信 (スペクトログラム＋スケルチ調整)</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 20px auto; padding: 15px; background: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    textarea { width: 100%; height: 60px; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; }
    button { padding: 12px 20px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; margin-right: 8px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .btn-send { background: #28a745; }
    .btn-listen { background: #007bff; }
    .btn-cancel { background: #dc3545; }
    select, input[type="checkbox"], input[type="range"] { padding: 6px; font-size: 14px; border-radius: 6px; margin-bottom: 6px; margin-right: 10px; }
    .status { margin-top: 10px; font-size: 14px; font-weight: bold; color: #d9534f; }
    .result { font-size: 26px; font-weight: bold; color: #007bff; padding: 12px; background: #e8f4ff; border-radius: 6px; min-height: 36px; word-break: break-all; margin-top: 10px; text-align: center; }
    .log { font-family: monospace; font-size: 11px; color: #333; background: #eee; padding: 8px; border-radius: 4px; margin-top: 10px; height: 140px; overflow-y: auto; white-space: pre-wrap; }
    .mode-group, .option-group, .btn-group { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 6px 0; }
    .mode-group label, .option-group label { font-weight: bold; margin-right: 4px; }
    .option-group label { font-weight: normal; display: flex; align-items: center; gap: 4px; }
    canvas { width: 100%; height: 150px; background: #111; border-radius: 6px; display: block; margin: 6px 0; }
    .slider-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .slider-group label { font-weight: bold; }
    .slider-group input[type="range"] { flex: 1; min-width: 120px; }
    .slider-group span { min-width: 40px; text-align: center; font-weight: bold; color: #007bff; }
  </style>
</head>
<body>

  <h2>🎵 音階音響通信 (スペクトログラム＋スケルチ調整)</h2>

  <div class="card">
    <h3>1. 送信設定</h3>
    <div class="mode-group">
      <label>送信モード:</label>
      <select id="txMode">
        <option value="accurate">🛡️ 正確 (100ms×3)</option>
        <option value="fast">⚡ 高速 (60ms×2)</option>
        <option value="turbo">🚀 正確高速 (60ms×3)</option>
      </select>
    </div>
    <div class="option-group">
      <label><input type="checkbox" id="txChordMode"> 和音 (2ビット/シンボル)</label>
      <label><input type="checkbox" id="txHeaderBoost"> ヘッダー強固 (4回)</label>
    </div>
    <textarea id="inputText" placeholder="日本語・漢字・ひらがなも送信できます">こんにちは世界</textarea>
    <button class="btn-send" id="btnPlay">🔊 音で送信</button>
  </div>

  <div class="card">
    <h3>2. 受信設定</h3>
    <div class="mode-group">
      <label>受信モード:</label>
      <select id="rxMode">
        <option value="accurate">🛡️ 正確 (100ms×3)</option>
        <option value="fast">⚡ 高速 (60ms×2)</option>
        <option value="turbo">🚀 正確高速 (60ms×3)</option>
      </select>
    </div>
    <div class="option-group">
      <label><input type="checkbox" id="rxChordMode"> 和音 (2ビット/シンボル)</label>
      <label><input type="checkbox" id="rxHeaderBoost"> ヘッダー強固 (4回)</label>
    </div>
    <div class="slider-group">
      <label>スケルチ (ノイズカット閾値):</label>
      <input type="range" id="squelchSlider" min="0" max="80" value="30">
      <span id="squelchValue">30%</span>
    </div>
    <canvas id="spectrogram"></canvas>
    <div class="btn-group">
      <button class="btn-listen" id="btnListen">🎤 受信開始</button>
      <button class="btn-cancel" id="btnCancel" disabled>⏹️ キャンセル</button>
    </div>
    <div id="status" class="status">待機中</div>
    <div id="outputText" class="result">---</div>
    <div id="log" class="log">ログがここに表示されます</div>
  </div>

<script>
// ---------- 音階定義 ----------
const FREQ_H0 = 523.25;  // C5 (bit 0)
const FREQ_H1 = 659.25;  // E5 (bit 1)
const FREQ_ST  = 783.99; // G5 (スタート音)
const FREQ_L0 = 261.63;  // C4 (和音bit 0)
const FREQ_L1 = 329.63;  // E4 (和音bit 1)

let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += "\n" + msg;
  el.scrollTop = el.scrollHeight;
}

// ---------- ハミング符号 ----------
function encodeHamming(d4) {
  const d = [(d4>>3)&1, (d4>>2)&1, (d4>>1)&1, d4&1];
  const p1 = d[0] ^ d[1] ^ d[3];
  const p2 = d[0] ^ d[2] ^ d[3];
  const p3 = d[1] ^ d[2] ^ d[3];
  return (d[0]<<6)|(d[1]<<5)|(d[2]<<4)|(d[3]<<3)|(p1<<2)|(p2<<1)|p3;
}

function decodeHamming(c7) {
  const b = [];
  for (let i = 6; i >= 0; i--) b.push((c7 >> i) & 1);
  const s1 = b[0] ^ b[1] ^ b[3] ^ b[4];
  const s2 = b[0] ^ b[2] ^ b[3] ^ b[5];
  const s3 = b[1] ^ b[2] ^ b[3] ^ b[6];
  const err = (s1 << 2) | (s2 << 1) | s3;
  if (err >= 1 && err <= 7) b[err - 1] ^= 1;
  return (b[0]<<3) | (b[1]<<2) | (b[2]<<1) | b[3];
}

function encodeByteTo14Bits(byteVal) {
  const high = encodeHamming((byteVal >> 4) & 0x0F);
  const low  = encodeHamming(byteVal & 0x0F);
  let bits = [];
  for (let i = 6; i >= 0; i--) bits.push((high >> i) & 1);
  for (let i = 6; i >= 0; i--) bits.push((low >> i) & 1);
  return bits;
}

function decode14BitsToByte(bits14) {
  if (bits14.length < 14) return 0;
  const highCode = bits14.slice(0, 7).reduce((acc, b) => (acc << 1) | b, 0);
  const lowCode  = bits14.slice(7, 14).reduce((acc, b) => (acc << 1) | b, 0);
  return (decodeHamming(highCode) << 4) | decodeHamming(lowCode);
}

// ---------- 送信ビット構築 ----------
function buildBits(text, mode, chordMode, headerBoost) {
  const bytes = new TextEncoder().encode(text);
  let rawBits = [];
  const isFast = (mode === 'fast' || mode === 'turbo');
  const header = (isFast ? 1 : 0) << 7 | (bytes.length & 0x7F);
  const headerBits = encodeByteTo14Bits(header);

  let dataRepeat;
  if (mode === 'accurate') dataRepeat = 3;
  else if (mode === 'fast') dataRepeat = 2;
  else if (mode === 'turbo') dataRepeat = 3;
  const headerRepeat = headerBoost ? 4 : dataRepeat;

  for (let bit of headerBits) {
    for (let i = 0; i < headerRepeat; i++) rawBits.push(bit);
  }
  for (let b of bytes) {
    const dataBits = encodeByteTo14Bits(b);
    for (let bit of dataBits) {
      for (let i = 0; i < dataRepeat; i++) rawBits.push(bit);
    }
  }

  if (chordMode) {
    let paired = [];
    for (let i = 0; i < rawBits.length; i += 2) {
      paired.push(rawBits[i] || 0, rawBits[i+1] || 0);
    }
    return paired;
  }
  return rawBits;
}

// ---------- 送信実行 ----------
document.getElementById('btnPlay').onclick = () => {
  const ctx = getCtx();
  const text = document.getElementById('inputText').value;
  const mode = document.getElementById('txMode').value;
  const chordMode = document.getElementById('txChordMode').checked;
  const headerBoost = document.getElementById('txHeaderBoost').checked;
  if (!text) return;

  let tBit;
  if (mode === 'accurate') tBit = 0.100;
  else if (mode === 'fast') tBit = 0.060;
  else if (mode === 'turbo') tBit = 0.060;

  const bits = buildBits(text, mode, chordMode, headerBoost);
  const now = ctx.currentTime + 0.1;

  const oscs = [];
  const gains = [];
  for (let i = 0; i < (chordMode ? 2 : 1); i++) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    oscs.push(osc);
    gains.push(gain);
  }

  oscs[0].frequency.setValueAtTime(FREQ_ST, now);
  gains[0].gain.setValueAtTime(0, now);
  gains[0].gain.linearRampToValueAtTime(0.2, now + 0.03);
  if (chordMode) {
    gains[1].gain.setValueAtTime(0, now);
  }

  let t = now + 0.3;
  let bitIndex = 0;
  while (bitIndex < bits.length) {
    const bit1 = bits[bitIndex];
    const bit2 = chordMode ? (bits[bitIndex+1] || 0) : 0;
    oscs[0].frequency.setValueAtTime(bit1 === 1 ? FREQ_H1 : FREQ_H0, t);
    gains[0].gain.setValueAtTime(0.2, t);
    if (chordMode) {
      oscs[1].frequency.setValueAtTime(bit2 === 1 ? FREQ_L1 : FREQ_L0, t);
      gains[1].gain.setValueAtTime(0.2, t);
    }
    t += tBit;
    bitIndex += chordMode ? 2 : 1;
  }

  const endTime = t;
  gains.forEach(g => {
    g.gain.setValueAtTime(0.2, endTime - 0.02);
    g.gain.linearRampToValueAtTime(0, endTime);
  });
  oscs.forEach(osc => { osc.start(now); osc.stop(endTime); });

  const modeName = { accurate:'正確', fast:'高速', turbo:'正確高速' }[mode];
  log(`送信: "${text}" (${modeName} ${chordMode?'和音':'単音'} ${headerBoost?'ヘッダー強固':''})`);
};

// ---------- スペクトログラム ----------
const canvas = document.getElementById('spectrogram');
const ctxCanvas = canvas.getContext('2d');
let spectrogramData = []; // 縦軸:周波数ビン, 横軸:時間
const MAX_HISTORY = 200;

function drawSpectrogram(dataArray, binSize, freqStart, freqEnd) {
  const width = canvas.width;
  const height = canvas.height;
  const imageData = ctxCanvas.createImageData(width, height);

  // 表示する周波数範囲 (ビンインデックス)
  const startBin = Math.floor(freqStart / binSize);
  const endBin = Math.floor(freqEnd / binSize);
  const binRange = endBin - startBin;

  // スペクトログラムデータを更新 (新しい列を追加)
  const column = [];
  for (let i = startBin; i < endBin; i++) {
    column.push(dataArray[i] || 0);
  }
  spectrogramData.push(column);
  if (spectrogramData.length > MAX_HISTORY) spectrogramData.shift();

  // 描画
  const colCount = spectrogramData.length;
  for (let x = 0; x < width; x++) {
    const srcX = Math.floor((x / width) * colCount);
    if (srcX >= colCount) continue;
    const col = spectrogramData[srcX];
    for (let y = 0; y < height; y++) {
      const srcY = Math.floor((y / height) * col.length);
      const val = col[srcY] || 0;
      // パワーを色に変換 (青→緑→赤)
      const intensity = Math.min(val / 128, 1);
      const r = Math.min(intensity * 2, 1) * 255;
      const g = Math.min((1 - Math.abs(intensity - 0.5) * 2), 1) * 255;
      const b = Math.max((1 - intensity * 2), 0) * 255;
      const idx = (y * width + x) * 4;
      imageData.data[idx] = r;
      imageData.data[idx+1] = g;
      imageData.data[idx+2] = b;
      imageData.data[idx+3] = 255;
    }
  }
  ctxCanvas.putImageData(imageData, 0, 0);
}

// ---------- 受信側 (スペクトログラム＋スケルチ) ----------
let receiveLoopId = null;
let spectrogramLoopId = null;
let mediaStream = null;
let isReceiving = false;
let analyserForSpectrogram = null;

function stopReceive(resetUI = true) {
  if (receiveLoopId) {
    clearInterval(receiveLoopId);
    receiveLoopId = null;
  }
  if (spectrogramLoopId) {
    clearInterval(spectrogramLoopId);
    spectrogramLoopId = null;
  }
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  isReceiving = false;
  document.getElementById('btnListen').disabled = false;
  document.getElementById('btnCancel').disabled = true;
  if (resetUI) {
    document.getElementById('status').textContent = '⏹️ キャンセル';
    document.getElementById('status').style.color = '#d9534f';
  }
}

document.getElementById('btnCancel').onclick = () => {
  log('⚠️ ユーザーキャンセル');
  stopReceive(true);
};

// スケルチスライダー
const squelchSlider = document.getElementById('squelchSlider');
const squelchValue = document.getElementById('squelchValue');
squelchSlider.oninput = () => {
  squelchValue.textContent = squelchSlider.value + '%';
};

document.getElementById('btnListen').onclick = async () => {
  const btn = document.getElementById('btnListen');
  const status = document.getElementById('status');
  const logEl = document.getElementById('log');
  const output = document.getElementById('outputText');
  
  if (isReceiving) stopReceive(false);
  
  logEl.textContent = "--- ログ開始 ---";
  output.textContent = "---";
  btn.disabled = true;
  document.getElementById('btnCancel').disabled = false;
  status.textContent = "🎤 マイク起動中...";
  status.style.color = '#d9534f';

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch(e) {
    log('❌ マイクアクセス拒否: ' + e.message);
    stopReceive(true);
    return;
  }

  const ctx = getCtx();
  const source = ctx.createMediaStreamSource(mediaStream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  source.connect(analyser);
  analyserForSpectrogram = analyser;

  const binSize = ctx.sampleRate / analyser.fftSize;
  // 表示する周波数範囲 (100Hz〜2000Hz)
  const freqStart = 100;
  const freqEnd = 2000;

  // スペクトログラム描画ループ (100ms間隔)
  spectrogramLoopId = setInterval(() => {
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    drawSpectrogram(data, binSize, freqStart, freqEnd);
  }, 100);

  // 受信処理 (従来のコードを流用、スケルチを動的に適用)
  const bH0 = Math.round(FREQ_H0 / binSize);
  const bH1 = Math.round(FREQ_H1 / binSize);
  const bST = Math.round(FREQ_ST / binSize);
  const bL0 = Math.round(FREQ_L0 / binSize);
  const bL1 = Math.round(FREQ_L1 / binSize);

  const rxMode = document.getElementById('rxMode').value;
  const chordMode = document.getElementById('rxChordMode').checked;
  const headerBoost = document.getElementById('rxHeaderBoost').checked;

  let tBitMs, dataRepeat;
  if (rxMode === 'accurate') { tBitMs = 100; dataRepeat = 3; }
  else if (rxMode === 'fast') { tBitMs = 60; dataRepeat = 2; }
  else if (rxMode === 'turbo') { tBitMs = 60; dataRepeat = 3; }

  const headerRepeat = headerBoost ? 4 : dataRepeat;
  log(`受信モード: ${rxMode} ${chordMode?'和音':'単音'} ヘッダー${headerRepeat}回 データ${dataRepeat}回`);

  const ST_THRESHOLD = 55;
  let state = 'idle';
  let pilotStartTime = 0, pilotEndTime = 0;
  let rawSamples = [], bitStream = [];
  let currentBitStart = 0, currentBitEnd = 0;
  let bitIndex = 0, totalBits = 0;
  let headerDecoded = false, headerDataLen = 0, receiveCompleted = false;

  function resetReceiveState() {
    state = 'idle';
    pilotStartTime = 0; pilotEndTime = 0;
    rawSamples = []; bitStream = [];
    currentBitStart = 0; currentBitEnd = 0;
    bitIndex = 0; totalBits = 0;
    headerDecoded = false; headerDataLen = 0; receiveCompleted = false;
  }

  receiveLoopId = setInterval(() => {
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    const now = Date.now();

    if (!isReceiving) return;

    // スケルチ閾値 (スライダー値)
    const squelchPercent = parseFloat(squelchSlider.value) / 100;
    let sum = 0;
    for (let i = 0; i < data.length; i++) sum += data[i];
    const avg = sum / data.length;
    const threshold = avg * squelchPercent;

    function getPower(index) {
      return data[index] > threshold ? data[index] : 0;
    }

    const stPower = getPower(bST);
    const isPilotOn = stPower > ST_THRESHOLD;

    if (state === 'idle') {
      if (isPilotOn) {
        state = 'pilot_on';
        pilotStartTime = now;
        status.textContent = '📡 スタート音検出中...';
        log('スタート音 ON');
      }
      return;
    }

    if (state === 'pilot_on') {
      if (!isPilotOn) {
        pilotEndTime = now;
        state = 'pilot_off';
        const margin = tBitMs * 0.20;
        const dataStartTime = pilotEndTime + margin;
        currentBitStart = dataStartTime;
        currentBitEnd = dataStartTime + tBitMs;
        bitIndex = 0;
        rawSamples = [];
        bitStream = [];
        headerDecoded = false;
        status.textContent = '⚡ データ受信開始';
        log(`パイロット OFF (${pilotEndTime - pilotStartTime}ms) 開始+${Math.round(margin)}ms`);
        return;
      }
      if (now - pilotStartTime > 500) {
        log('⚠️ パイロットタイムアウト');
        resetReceiveState();
        status.textContent = '🔄 リセット';
      }
      return;
    }

    if (state === 'pilot_off' || state === 'receiving') {
      if (state === 'pilot_off') state = 'receiving';

      if (now >= currentBitStart && now < currentBitEnd) {
        const pH0 = getPower(bH0);
        const pH1 = getPower(bH1);
        const pL0 = chordMode ? getPower(bL0) : 0;
        const pL1 = chordMode ? getPower(bL1) : 0;
        rawSamples.push({ pH0, pH1, pL0, pL1 });
      }

      if (now >= currentBitEnd) {
        if (rawSamples.length > 0) {
          let avgH0=0, avgH1=0, avgL0=0, avgL1=0;
          for (let s of rawSamples) {
            avgH0 += s.pH0; avgH1 += s.pH1;
            avgL0 += s.pL0; avgL1 += s.pL1;
          }
          avgH0 /= rawSamples.length; avgH1 /= rawSamples.length;
          avgL0 /= rawSamples.length; avgL1 /= rawSamples.length;

          const bitH = avgH1 > avgH0 ? 1 : 0;
          bitStream.push(bitH); bitIndex++;
          if (chordMode) {
            const bitL = avgL1 > avgL0 ? 1 : 0;
            bitStream.push(bitL); bitIndex++;
          }
          status.textContent = `📥 受信中... ${bitIndex} ビット`;
        }

        currentBitStart = currentBitEnd;
        currentBitEnd = currentBitStart + tBitMs;
        rawSamples = [];

        const bitsPerHeader = 14 * headerRepeat * (chordMode ? 2 : 1);
        if (!headerDecoded && bitStream.length >= bitsPerHeader) {
          const headerRaw = bitStream.slice(0, bitsPerHeader);
          let headerBits14 = [];
          if (chordMode) {
            for (let i = 0; i < headerRaw.length; i += 2) headerBits14.push(headerRaw[i]);
          } else {
            headerBits14 = headerRaw;
          }
          let voted14 = [];
          for (let i = 0; i < 14 * headerRepeat; i += headerRepeat) {
            let sum = 0;
            for (let j = 0; j < headerRepeat; j++) sum += headerBits14[i+j] || 0;
            voted14.push(sum >= headerRepeat/2 ? 1 : 0);
          }
          const headerByte = decode14BitsToByte(voted14);
          const dataLen = headerByte & 0x7F;
          if (dataLen > 200 || dataLen === 0) {
            log(`❌ 異常データ長(${dataLen})`);
            resetReceiveState();
            status.textContent = '🔄 リセット (異常ヘッダー)';
            return;
          }
          const isFast = (rxMode === 'fast' || rxMode === 'turbo');
          const isFastFromHeader = ((headerByte >> 7) & 1) === 1;
          if (isFastFromHeader !== isFast) {
            log(`⚠️ モード不一致 (ヘッダー:${isFastFromHeader?'高速':'正確'}, 受信:${isFast?'高速':'正確'})`);
          }
          const bitsPerDataByte = 14 * dataRepeat * (chordMode ? 2 : 1);
          totalBits = bitsPerHeader + (dataLen * bitsPerDataByte);
          headerDecoded = true;
          headerDataLen = dataLen;
          log(`ヘッダー復号: データ長=${dataLen}バイト, 総ビット数=${totalBits}`);
          status.textContent = `📥 受信中... (${bitIndex}/${totalBits} ビット)`;
        }

        if (headerDecoded && bitStream.length >= totalBits && !receiveCompleted) {
          receiveCompleted = true;
          log(`受信完了 (${bitStream.length} ビット)`);
          clearInterval(receiveLoopId); receiveLoopId = null;
          clearInterval(spectrogramLoopId); spectrogramLoopId = null;
          mediaStream.getTracks().forEach(t => t.stop());
          mediaStream = null;
          isReceiving = false;
          document.getElementById('btnListen').disabled = false;
          document.getElementById('btnCancel').disabled = true;
          status.textContent = '✅ 受信完了';
          status.style.color = '#28a745';

          const validBits = bitStream.slice(0, totalBits);
          decodeStream(validBits, chordMode, headerRepeat, dataRepeat);
          return;
        }
      }
    }
  }, 2);
  isReceiving = true;
};

// ---------- デコード ----------
function decodeStream(bitStream, chordMode, headerRepeat, dataRepeat) {
  const output = document.getElementById('outputText');
  const bitsPerHeader = 14 * headerRepeat * (chordMode ? 2 : 1);
  const bitsPerDataByte = 14 * dataRepeat * (chordMode ? 2 : 1);

  if (bitStream.length < bitsPerHeader) {
    log('❌ ビットストリーム短すぎ');
    output.textContent = 'データ不足';
    return;
  }

  const headerRaw = bitStream.slice(0, bitsPerHeader);
  let headerBits14 = [];
  if (chordMode) {
    for (let i = 0; i < headerRaw.length; i += 2) headerBits14.push(headerRaw[i]);
  } else {
    headerBits14 = headerRaw;
  }
  let votedHeader = [];
  for (let i = 0; i < 14 * headerRepeat; i += headerRepeat) {
    let sum = 0;
    for (let j = 0; j < headerRepeat; j++) sum += headerBits14[i+j] || 0;
    votedHeader.push(sum >= headerRepeat/2 ? 1 : 0);
  }
  const headerByte = decode14BitsToByte(votedHeader);
  const dataLen = headerByte & 0x7F;
  log(`デコード: データ長=${dataLen}`);

  let bytes = [];
  let offset = bitsPerHeader;
  for (let i = 0; i < dataLen; i++) {
    if (offset + bitsPerDataByte > bitStream.length) break;
    const raw = bitStream.slice(offset, offset + bitsPerDataByte);
    let dataBits14 = [];
    if (chordMode) {
      for (let j = 0; j < raw.length; j += 2) dataBits14.push(raw[j]);
    } else {
      dataBits14 = raw;
    }
    let votedData = [];
    for (let j = 0; j < 14 * dataRepeat; j += dataRepeat) {
      let sum = 0;
      for (let k = 0; k < dataRepeat; k++) sum += dataBits14[j+k] || 0;
      votedData.push(sum >= dataRepeat/2 ? 1 : 0);
    }
    bytes.push(decode14BitsToByte(votedData));
    offset += bitsPerDataByte;
  }

  const hexStr = bytes.map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
  log(`受信バイト列: ${hexStr}`);
  try {
    const decoder = new TextDecoder('utf-8', { fatal: false });
    const text = decoder.decode(new Uint8Array(bytes));
    if (text.includes('\uFFFD')) log('⚠️ 置換文字(�)を含む');
    log(`✅ 復元: "${text}"`);
    output.textContent = text || "(空)";
  } catch(e) {
    log(`❌ デコードエラー: ${e.message}`);
    output.textContent = "デコードエラー";
  }
}

window.addEventListener('beforeunload', () => {
  if (isReceiving) stopReceive(false);
});
</script>
