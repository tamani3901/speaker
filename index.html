<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>音階音響通信 (高速モード安定版・2.5倍速)</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 20px auto; padding: 15px; background: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    textarea { width: 100%; height: 60px; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; }
    button { padding: 12px 20px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; margin-right: 8px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .btn-send { background: #28a745; }
    .btn-listen { background: #007bff; }
    .btn-cancel { background: #dc3545; }
    select { padding: 10px; font-size: 15px; border-radius: 6px; margin-bottom: 10px; margin-right: 10px; }
    .status { margin-top: 10px; font-size: 14px; font-weight: bold; color: #d9534f; }
    .result { font-size: 26px; font-weight: bold; color: #007bff; padding: 12px; background: #e8f4ff; border-radius: 6px; min-height: 36px; word-break: break-all; margin-top: 10px; text-align: center; }
    .log { font-family: monospace; font-size: 11px; color: #333; background: #eee; padding: 8px; border-radius: 4px; margin-top: 10px; height: 160px; overflow-y: auto; white-space: pre-wrap; }
    .mode-group { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .mode-group label { font-weight: bold; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  </style>
</head>
<body>

  <h2>🎵 音階音響通信 (高速モード安定版・2.5倍速)</h2>

  <div class="card">
    <h3>1. 送信設定</h3>
    <div class="mode-group">
      <label>送信モード: </label>
      <select id="txMode">
        <option value="accurate">🛡️ 正確モード (100ms×3)</option>
        <option value="fast">⚡ 高速モード (60ms×2) 約2.5倍速</option>
      </select>
    </div>
    <textarea id="inputText" placeholder="送信する文字列">Hello</textarea>
    <div>
      <button class="btn-send" id="btnPlay">🔊 音で送信</button>
    </div>
  </div>

  <div class="card">
    <h3>2. 受信設定</h3>
    <div class="mode-group">
      <label>受信モード: </label>
      <select id="rxMode">
        <option value="accurate">🛡️ 正確モード (100ms×3)</option>
        <option value="fast">⚡ 高速モード (60ms×2) 約2.5倍速</option>
      </select>
    </div>
    <div class="btn-group">
      <button class="btn-listen" id="btnListen">🎤 マイクで受信開始</button>
      <button class="btn-cancel" id="btnCancel" disabled>⏹️ 受信キャンセル</button>
    </div>
    <div id="status" class="status">待機中</div>
    <div id="outputText" class="result">---</div>
    <div id="log" class="log">ログがここに表示されます</div>
  </div>

<script>
// 音階 (C5: ド, E5: ミ, G5: ソ)
const FREQ_0  = 523.25; // Bit 0
const FREQ_1  = 659.25; // Bit 1
const FREQ_ST = 783.99; // スタート音

let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += "\n" + msg;
  el.scrollTop = el.scrollHeight;
}

// ---------- ハミング符号 (7,4) ----------
function encodeHamming(d4) {
  const d = [(d4>>3)&1, (d4>>2)&1, (d4>>1)&1, d4&1];
  const p1 = d[0] ^ d[1] ^ d[3];
  const p2 = d[0] ^ d[2] ^ d[3];
  const p3 = d[1] ^ d[2] ^ d[3];
  return (d[0]<<6)|(d[1]<<5)|(d[2]<<4)|(d[3]<<3)|(p1<<2)|(p2<<1)|p3;
}

function decodeHamming(c7) {
  const b = [];
  for (let i = 6; i >= 0; i--) b.push((c7 >> i) & 1);
  const s1 = b[0] ^ b[1] ^ b[3] ^ b[4];
  const s2 = b[0] ^ b[2] ^ b[3] ^ b[5];
  const s3 = b[1] ^ b[2] ^ b[3] ^ b[6];
  const err = (s1 << 2) | (s2 << 1) | s3;
  if (err >= 1 && err <= 7) b[err - 1] ^= 1;
  return (b[0]<<3) | (b[1]<<2) | (b[2]<<1) | b[3];
}

function encodeByteTo14Bits(byteVal) {
  const high = encodeHamming((byteVal >> 4) & 0x0F);
  const low  = encodeHamming(byteVal & 0x0F);
  let bits = [];
  for (let i = 6; i >= 0; i--) bits.push((high >> i) & 1);
  for (let i = 6; i >= 0; i--) bits.push((low >> i) & 1);
  return bits;
}

// ---------- 送信側 ----------
function buildBits(text, isFast) {
  const bytes = new TextEncoder().encode(text);
  let rawBits = [];

  // ヘッダー: [モードフラグ(0/1)][データ長(7bit)]
  const header = (isFast ? 1 : 0) << 7 | (bytes.length & 0x7F);
  rawBits.push(...encodeByteTo14Bits(header));

  for (let b of bytes) {
    rawBits.push(...encodeByteTo14Bits(b));
  }

  const repeat = isFast ? 2 : 3;
  let repeated = [];
  for (let bit of rawBits) {
    for (let i = 0; i < repeat; i++) repeated.push(bit);
  }
  return repeated;
}

document.getElementById('btnPlay').onclick = () => {
  const ctx = getCtx();
  const text = document.getElementById('inputText').value;
  const isFast = document.getElementById('txMode').value === 'fast';
  if (!text) return;

  // 高速モードは 60ms, 正確は 100ms
  const tBit = isFast ? 0.060 : 0.100;
  const bits = buildBits(text, isFast);
  const now = ctx.currentTime + 0.1;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);

  // パイロット音 (ソ: 300ms)
  osc.frequency.setValueAtTime(FREQ_ST, now);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.2, now + 0.03);

  let t = now + 0.3;
  bits.forEach((bit) => {
    osc.frequency.setValueAtTime(bit === 1 ? FREQ_1 : FREQ_0, t);
    t += tBit;
  });

  gain.gain.setValueAtTime(0.2, t - 0.02);
  gain.gain.linearRampToValueAtTime(0, t);

  osc.start(now);
  osc.stop(t);
  log(`送信: ${text} (${isFast ? '高速(60ms×2)' : '正確(100ms×3)'}モード, ${bits.length}ビット)`);
};

// ---------- 受信側 (キャンセル対応・パイロット立ち下がり検出) ----------
let receiveLoopId = null;
let mediaStream = null;
let isReceiving = false;

function stopReceive(resetUI = true) {
  if (receiveLoopId) {
    clearInterval(receiveLoopId);
    receiveLoopId = null;
  }
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  isReceiving = false;
  document.getElementById('btnListen').disabled = false;
  document.getElementById('btnCancel').disabled = true;
  if (resetUI) {
    document.getElementById('status').textContent = '⏹️ 受信キャンセルされました';
    document.getElementById('status').style.color = '#d9534f';
  }
}

document.getElementById('btnCancel').onclick = () => {
  log('⚠️ ユーザーにより受信キャンセル');
  stopReceive(true);
};

document.getElementById('btnListen').onclick = async () => {
  const btn = document.getElementById('btnListen');
  const status = document.getElementById('status');
  const logEl = document.getElementById('log');
  const output = document.getElementById('outputText');
  
  if (isReceiving) stopReceive(false);
  
  logEl.textContent = "--- ログ開始 ---";
  output.textContent = "---";
  btn.disabled = true;
  document.getElementById('btnCancel').disabled = false;
  status.textContent = "🎤 マイク起動中...";
  status.style.color = '#d9534f';

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch(e) {
    log('❌ マイクアクセス拒否: ' + e.message);
    stopReceive(true);
    return;
  }

  const ctx = getCtx();
  const source = ctx.createMediaStreamSource(mediaStream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  source.connect(analyser);

  const binSize = ctx.sampleRate / analyser.fftSize;
  const b0  = Math.round(FREQ_0 / binSize);
  const b1  = Math.round(FREQ_1 / binSize);
  const bST = Math.round(FREQ_ST / binSize);

  const data = new Uint8Array(analyser.frequencyBinCount);

  const rxMode = document.getElementById('rxMode').value;
  const isFast = rxMode === 'fast';
  const tBitMs = isFast ? 60 : 100;      // 変更点: 高速60ms
  const repeat = isFast ? 2 : 3;
  log(`受信モード: ${isFast ? '高速(60ms×2)' : '正確(100ms×3)'}`);

  const ST_THRESHOLD = 55;
  let state = 'idle'; 
  let pilotStartTime = 0;
  let pilotEndTime = 0;
  let dataStartTime = 0;
  
  let rawSamples = [];
  let bitStream = [];
  let currentBitStart = 0;
  let currentBitEnd = 0;
  let bitIndex = 0;
  let totalBits = 0;
  let headerDecoded = false;
  let headerDataLen = 0;
  let receiveCompleted = false;

  function resetReceiveState() {
    state = 'idle';
    pilotStartTime = 0;
    pilotEndTime = 0;
    dataStartTime = 0;
    rawSamples = [];
    bitStream = [];
    currentBitStart = 0;
    currentBitEnd = 0;
    bitIndex = 0;
    totalBits = 0;
    headerDecoded = false;
    headerDataLen = 0;
    receiveCompleted = false;
  }

  receiveLoopId = setInterval(() => {
    analyser.getByteFrequencyData(data);
    const now = Date.now();

    if (!isReceiving) return;

    const stPower = data[bST];
    const isPilotOn = stPower > ST_THRESHOLD;

    if (state === 'idle') {
      if (isPilotOn) {
        state = 'pilot_on';
        pilotStartTime = now;
        status.textContent = '📡 スタート音(ソ)を検出中...';
        log('スタート音 ON 検出');
      }
      return;
    }

    if (state === 'pilot_on') {
      if (!isPilotOn) {
        pilotEndTime = now;
        state = 'pilot_off';
        // パイロット終了から 10ms 後にデータ開始（マージン確保）
        dataStartTime = pilotEndTime + 10;
        currentBitStart = dataStartTime;
        currentBitEnd = dataStartTime + tBitMs;
        bitIndex = 0;
        rawSamples = [];
        bitStream = [];
        headerDecoded = false;
        status.textContent = '⚡ パイロット終了 → データ受信開始';
        log(`パイロット OFF 検出 (${pilotEndTime - pilotStartTime}ms) データ開始+10ms`);
        return;
      }
      if (now - pilotStartTime > 500) {
        log('⚠️ パイロット音が長すぎるためリセット');
        resetReceiveState();
        status.textContent = '🔄 リセット（パイロットタイムアウト）';
      }
      return;
    }

    // ---- データ受信フェーズ ----
    if (state === 'pilot_off' || state === 'receiving') {
      if (state === 'pilot_off') state = 'receiving';
      
      if (now >= currentBitStart && now < currentBitEnd) {
        rawSamples.push({ val0: data[b0], val1: data[b1] });
      }

      if (now >= currentBitEnd) {
        if (rawSamples.length > 0) {
          let sum0 = 0, sum1 = 0;
          for (let s of rawSamples) {
            sum0 += s.val0;
            sum1 += s.val1;
          }
          const bit = (sum1 / rawSamples.length) > (sum0 / rawSamples.length) ? 1 : 0;
          bitStream.push(bit);
          bitIndex++;
          status.textContent = `📥 受信中... ${bitIndex} ビット`;
        }

        currentBitStart = currentBitEnd;
        currentBitEnd = currentBitStart + tBitMs;
        rawSamples = [];

        // ---- ヘッダー判読 ----
        if (!headerDecoded && bitStream.length >= 14 * repeat) {
          const headerRaw = bitStream.slice(0, 14 * repeat);
          const headerByte = decodeBitsToByte(headerRaw, repeat);
          const isFastFromHeader = ((headerByte >> 7) & 1) === 1;
          const dataLen = headerByte & 0x7F;
          
          if (dataLen > 200) {
            log(`❌ 異常なデータ長(${dataLen})を検出。受信をリセットします。`);
            resetReceiveState();
            status.textContent = '🔄 リセット（異常ヘッダー）';
            return;
          }
          
          // モード不一致はログに残すだけ（ステータスには出さない）
          if (isFastFromHeader !== isFast) {
            log(`⚠️ ヘッダーモード(${isFastFromHeader?'高速':'正確'})が受信設定(${isFast?'高速':'正確'})と異なりますが継続します。`);
          }
          totalBits = (1 + dataLen) * 14 * repeat;
          headerDecoded = true;
          headerDataLen = dataLen;
          log(`ヘッダー復号: データ長=${dataLen}バイト, 総ビット数=${totalBits}`);
          status.textContent = `📥 受信中... (${bitIndex}/${totalBits} ビット)`;
        }

        // ---- 全ビット受信完了 ----
        if (headerDecoded && bitStream.length >= totalBits && !receiveCompleted) {
          receiveCompleted = true;
          log(`受信完了 (${bitStream.length} ビット)`);
          clearInterval(receiveLoopId);
          receiveLoopId = null;
          mediaStream.getTracks().forEach(t => t.stop());
          mediaStream = null;
          isReceiving = false;
          document.getElementById('btnListen').disabled = false;
          document.getElementById('btnCancel').disabled = true;
          status.textContent = '✅ 受信完了';
          status.style.color = '#28a745';
          
          // totalBits 分だけを切り出してデコード（余分は捨てる）
          const validBits = bitStream.slice(0, totalBits);
          decodeStream(validBits, repeat);
          return;
        }
      }
    }
  }, 3); // サンプリング間隔 3ms（より細かく）

  isReceiving = true;
};

// ---------- デコードユーティリティ ----------
function decodeBitsToByte(rawBits, repeat) {
  let voted = [];
  for (let i = 0; i < rawBits.length; i += repeat) {
    let sum = 0;
    for (let j = 0; j < repeat; j++) {
      sum += (i + j < rawBits.length) ? rawBits[i + j] : 0;
    }
    voted.push(sum >= repeat/2 ? 1 : 0);
  }
  if (voted.length < 14) return 0;
  const highCode = voted.slice(0, 7).reduce((acc, b) => (acc << 1) | b, 0);
  const lowCode  = voted.slice(7, 14).reduce((acc, b) => (acc << 1) | b, 0);
  return (decodeHamming(highCode) << 4) | decodeHamming(lowCode);
}

function decodeStream(bitStream, repeat) {
  const output = document.getElementById('outputText');
  const bitsPerByte = 14 * repeat;

  if (bitStream.length < bitsPerByte) {
    log('❌ ビットストリームが短すぎます');
    output.textContent = 'データ不足';
    return;
  }

  const headerRaw = bitStream.slice(0, bitsPerByte);
  const headerByte = decodeBitsToByte(headerRaw, repeat);
  const dataLen = headerByte & 0x7F;
  log(`デコード: データ長=${dataLen}`);

  let bytes = [];
  for (let i = 0; i < dataLen; i++) {
    const offset = (1 + i) * bitsPerByte;
    if (offset + bitsPerByte > bitStream.length) break;
    const raw = bitStream.slice(offset, offset + bitsPerByte);
    const b = decodeBitsToByte(raw, repeat);
    bytes.push(b);
  }

  try {
    const text = new TextDecoder().decode(new Uint8Array(bytes));
    log(`✅ 復元成功: "${text}"`);
    output.textContent = text || "(空文字列)";
  } catch(e) {
    log(`❌ デコードエラー: ${e.message}`);
    output.textContent = "デコードエラー";
  }
}

window.addEventListener('beforeunload', () => {
  if (isReceiving) stopReceive(false);
});
</script>
</body>
</html>
