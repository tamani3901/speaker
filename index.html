<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>音階音響通信 (ヘッダー強固モード付き)</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 20px auto; padding: 15px; background: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    textarea { width: 100%; height: 60px; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; }
    button { padding: 12px 20px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; margin-right: 8px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .btn-send { background: #28a745; }
    .btn-listen { background: #007bff; }
    .btn-cancel { background: #dc3545; }
    select, input[type="checkbox"] { padding: 10px; font-size: 15px; border-radius: 6px; margin-bottom: 10px; margin-right: 10px; }
    .status { margin-top: 10px; font-size: 14px; font-weight: bold; color: #d9534f; }
    .result { font-size: 26px; font-weight: bold; color: #007bff; padding: 12px; background: #e8f4ff; border-radius: 6px; min-height: 36px; word-break: break-all; margin-top: 10px; text-align: center; }
    .log { font-family: monospace; font-size: 11px; color: #333; background: #eee; padding: 8px; border-radius: 4px; margin-top: 10px; height: 180px; overflow-y: auto; white-space: pre-wrap; }
    .mode-group { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .mode-group label { font-weight: bold; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .option-group { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
    .option-group label { display: flex; align-items: center; gap: 5px; font-weight: normal; }
  </style>
</head>
<body>

  <h2>🎵 音階音響通信 (ヘッダー強固モード)</h2>

  <div class="card">
    <h3>1. 送信設定</h3>
    <div class="mode-group">
      <label>送信モード: </label>
      <select id="txMode">
        <option value="accurate">🛡️ 正確モード (100ms×3) 最も確実</option>
        <option value="fast">⚡ 高速モード (60ms×2) 最速</option>
        <option value="turbo">🚀 正確高速モード (60ms×3) おすすめ</option>
      </select>
    </div>
    <div class="option-group">
      <label><input type="checkbox" id="txHeaderBoost"> ヘッダーを強固にする (4回繰り返し)</label>
    </div>
    <textarea id="inputText" placeholder="日本語・漢字・ひらがなも送信できます">こんにちは世界</textarea>
    <div>
      <button class="btn-send" id="btnPlay">🔊 音で送信</button>
    </div>
  </div>

  <div class="card">
    <h3>2. 受信設定</h3>
    <div class="mode-group">
      <label>受信モード: </label>
      <select id="rxMode">
        <option value="accurate">🛡️ 正確モード (100ms×3) 最も確実</option>
        <option value="fast">⚡ 高速モード (60ms×2) 最速</option>
        <option value="turbo">🚀 正確高速モード (60ms×3) おすすめ</option>
      </select>
    </div>
    <div class="option-group">
      <label><input type="checkbox" id="rxHeaderBoost"> ヘッダーを強固にする (4回繰り返し)</label>
    </div>
    <div class="btn-group">
      <button class="btn-listen" id="btnListen">🎤 マイクで受信開始</button>
      <button class="btn-cancel" id="btnCancel" disabled>⏹️ 受信キャンセル</button>
    </div>
    <div id="status" class="status">待機中</div>
    <div id="outputText" class="result">---</div>
    <div id="log" class="log">ログがここに表示されます</div>
  </div>

<script>
// 音階 (C5: ド, E5: ミ, G5: ソ)
const FREQ_0  = 523.25; // Bit 0
const FREQ_1  = 659.25; // Bit 1
const FREQ_ST = 783.99; // スタート音

let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += "\n" + msg;
  el.scrollTop = el.scrollHeight;
}

// ---------- ハミング符号 (7,4) ----------
function encodeHamming(d4) {
  const d = [(d4>>3)&1, (d4>>2)&1, (d4>>1)&1, d4&1];
  const p1 = d[0] ^ d[1] ^ d[3];
  const p2 = d[0] ^ d[2] ^ d[3];
  const p3 = d[1] ^ d[2] ^ d[3];
  return (d[0]<<6)|(d[1]<<5)|(d[2]<<4)|(d[3]<<3)|(p1<<2)|(p2<<1)|p3;
}

function decodeHamming(c7) {
  const b = [];
  for (let i = 6; i >= 0; i--) b.push((c7 >> i) & 1);
  const s1 = b[0] ^ b[1] ^ b[3] ^ b[4];
  const s2 = b[0] ^ b[2] ^ b[3] ^ b[5];
  const s3 = b[1] ^ b[2] ^ b[3] ^ b[6];
  const err = (s1 << 2) | (s2 << 1) | s3;
  if (err >= 1 && err <= 7) b[err - 1] ^= 1;
  return (b[0]<<3) | (b[1]<<2) | (b[2]<<1) | b[3];
}

function encodeByteTo14Bits(byteVal) {
  const high = encodeHamming((byteVal >> 4) & 0x0F);
  const low  = encodeHamming(byteVal & 0x0F);
  let bits = [];
  for (let i = 6; i >= 0; i--) bits.push((high >> i) & 1);
  for (let i = 6; i >= 0; i--) bits.push((low >> i) & 1);
  return bits;
}

// ---------- 送信側 ----------
function buildBits(text, mode, headerBoost) {
  const bytes = new TextEncoder().encode(text);
  let rawBits = [];

  // ヘッダー: [モードフラグ(0/1)][データ長(7bit)]
  const isFast = (mode === 'fast' || mode === 'turbo');
  const header = (isFast ? 1 : 0) << 7 | (bytes.length & 0x7F);
  const headerBits = encodeByteTo14Bits(header);

  // データ部分の繰り返し回数
  let dataRepeat;
  if (mode === 'accurate') dataRepeat = 3;
  else if (mode === 'fast') dataRepeat = 2;
  else if (mode === 'turbo') dataRepeat = 3;

  // ヘッダー繰り返し回数 (強固モードなら4、そうでなければデータと同じ)
  const headerRepeat = headerBoost ? 4 : dataRepeat;

  // ヘッダーを繰り返し追加
  for (let bit of headerBits) {
    for (let i = 0; i < headerRepeat; i++) rawBits.push(bit);
  }

  // データ部分を繰り返し追加
  for (let b of bytes) {
    const dataBits = encodeByteTo14Bits(b);
    for (let bit of dataBits) {
      for (let i = 0; i < dataRepeat; i++) rawBits.push(bit);
    }
  }

  return rawBits;
}

document.getElementById('btnPlay').onclick = () => {
  const ctx = getCtx();
  const text = document.getElementById('inputText').value;
  const mode = document.getElementById('txMode').value;
  const headerBoost = document.getElementById('txHeaderBoost').checked;
  if (!text) return;

  let tBit;
  if (mode === 'accurate') tBit = 0.100;
  else if (mode === 'fast') tBit = 0.060;
  else if (mode === 'turbo') tBit = 0.060;

  const bits = buildBits(text, mode, headerBoost);
  const now = ctx.currentTime + 0.1;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);

  // パイロット音 (ソ: 300ms)
  osc.frequency.setValueAtTime(FREQ_ST, now);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.2, now + 0.03);

  let t = now + 0.3;
  bits.forEach((bit) => {
    osc.frequency.setValueAtTime(bit === 1 ? FREQ_1 : FREQ_0, t);
    t += tBit;
  });

  gain.gain.setValueAtTime(0.2, t - 0.02);
  gain.gain.linearRampToValueAtTime(0, t);

  osc.start(now);
  osc.stop(t);
  
  const modeName = { accurate: '正確', fast: '高速', turbo: '正確高速' }[mode];
  const boostStr = headerBoost ? ' (ヘッダー強固)' : '';
  log(`送信: "${text}" (${modeName}${boostStr}, ${bits.length}ビット)`);
};

// ---------- 受信側 ----------
let receiveLoopId = null;
let mediaStream = null;
let isReceiving = false;

function stopReceive(resetUI = true) {
  if (receiveLoopId) {
    clearInterval(receiveLoopId);
    receiveLoopId = null;
  }
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  isReceiving = false;
  document.getElementById('btnListen').disabled = false;
  document.getElementById('btnCancel').disabled = true;
  if (resetUI) {
    document.getElementById('status').textContent = '⏹️ 受信キャンセルされました';
    document.getElementById('status').style.color = '#d9534f';
  }
}

document.getElementById('btnCancel').onclick = () => {
  log('⚠️ ユーザーにより受信キャンセル');
  stopReceive(true);
};

document.getElementById('btnListen').onclick = async () => {
  const btn = document.getElementById('btnListen');
  const status = document.getElementById('status');
  const logEl = document.getElementById('log');
  const output = document.getElementById('outputText');
  
  if (isReceiving) stopReceive(false);
  
  logEl.textContent = "--- ログ開始 ---";
  output.textContent = "---";
  btn.disabled = true;
  document.getElementById('btnCancel').disabled = false;
  status.textContent = "🎤 マイク起動中...";
  status.style.color = '#d9534f';

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch(e) {
    log('❌ マイクアクセス拒否: ' + e.message);
    stopReceive(true);
    return;
  }

  const ctx = getCtx();
  const source = ctx.createMediaStreamSource(mediaStream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  source.connect(analyser);

  const binSize = ctx.sampleRate / analyser.fftSize;
  const b0  = Math.round(FREQ_0 / binSize);
  const b1  = Math.round(FREQ_1 / binSize);
  const bST = Math.round(FREQ_ST / binSize);

  const data = new Uint8Array(analyser.frequencyBinCount);

  const rxMode = document.getElementById('rxMode').value;
  const headerBoost = document.getElementById('rxHeaderBoost').checked;

  let tBitMs, dataRepeat;
  if (rxMode === 'accurate') { tBitMs = 100; dataRepeat = 3; }
  else if (rxMode === 'fast') { tBitMs = 60; dataRepeat = 2; }
  else if (rxMode === 'turbo') { tBitMs = 60; dataRepeat = 3; }

  // ヘッダー用の繰り返し回数 (強固モードなら4、そうでなければデータと同じ)
  const headerRepeat = headerBoost ? 4 : dataRepeat;

  const modeName = { accurate: '正確', fast: '高速', turbo: '正確高速' }[rxMode];
  const boostStr = headerBoost ? ' (ヘッダー強固)' : '';
  log(`受信モード: ${modeName}${boostStr}`);

  const ST_THRESHOLD = 55;
  let state = 'idle'; 
  let pilotStartTime = 0;
  let pilotEndTime = 0;
  
  let rawSamples = [];
  let bitStream = [];
  let currentBitStart = 0;
  let currentBitEnd = 0;
  let bitIndex = 0;
  let totalBits = 0;
  let headerDecoded = false;
  let headerDataLen = 0;
  let receiveCompleted = false;

  function resetReceiveState() {
    state = 'idle';
    pilotStartTime = 0;
    pilotEndTime = 0;
    rawSamples = [];
    bitStream = [];
    currentBitStart = 0;
    currentBitEnd = 0;
    bitIndex = 0;
    totalBits = 0;
    headerDecoded = false;
    headerDataLen = 0;
    receiveCompleted = false;
  }

  receiveLoopId = setInterval(() => {
    analyser.getByteFrequencyData(data);
    const now = Date.now();

    if (!isReceiving) return;

    const stPower = data[bST];
    const isPilotOn = stPower > ST_THRESHOLD;

    if (state === 'idle') {
      if (isPilotOn) {
        state = 'pilot_on';
        pilotStartTime = now;
        status.textContent = '📡 スタート音(ソ)を検出中...';
        log('スタート音 ON 検出');
      }
      return;
    }

    if (state === 'pilot_on') {
      if (!isPilotOn) {
        pilotEndTime = now;
        state = 'pilot_off';
        const margin = tBitMs * 0.20;
        const dataStartTime = pilotEndTime + margin;
        currentBitStart = dataStartTime;
        currentBitEnd = dataStartTime + tBitMs;
        bitIndex = 0;
        rawSamples = [];
        bitStream = [];
        headerDecoded = false;
        status.textContent = '⚡ パイロット終了 → データ受信開始';
        log(`パイロット OFF 検出 (${pilotEndTime - pilotStartTime}ms) データ開始+${Math.round(margin)}ms`);
        return;
      }
      if (now - pilotStartTime > 500) {
        log('⚠️ パイロット音が長すぎるためリセット');
        resetReceiveState();
        status.textContent = '🔄 リセット（パイロットタイムアウト）';
      }
      return;
    }

    // ---- データ受信フェーズ ----
    if (state === 'pilot_off' || state === 'receiving') {
      if (state === 'pilot_off') state = 'receiving';
      
      if (now >= currentBitStart && now < currentBitEnd) {
        rawSamples.push({ val0: data[b0], val1: data[b1] });
      }

      if (now >= currentBitEnd) {
        if (rawSamples.length > 0) {
          let sum0 = 0, sum1 = 0;
          for (let s of rawSamples) {
            sum0 += s.val0;
            sum1 += s.val1;
          }
          const bit = (sum1 / rawSamples.length) > (sum0 / rawSamples.length) ? 1 : 0;
          bitStream.push(bit);
          bitIndex++;
          status.textContent = `📥 受信中... ${bitIndex} ビット`;
        }

        currentBitStart = currentBitEnd;
        currentBitEnd = currentBitStart + tBitMs;
        rawSamples = [];

        // ---- ヘッダー判読 (ヘッダー用の繰り返し回数を使用) ----
        if (!headerDecoded && bitStream.length >= 14 * headerRepeat) {
          const headerRaw = bitStream.slice(0, 14 * headerRepeat);
          const headerByte = decodeBitsToByte(headerRaw, headerRepeat);
          const isFastFromHeader = ((headerByte >> 7) & 1) === 1;
          const dataLen = headerByte & 0x7F;
          
          if (dataLen > 200 || dataLen === 0) {
            log(`❌ 異常なデータ長(${dataLen})を検出。受信をリセットします。`);
            resetReceiveState();
            status.textContent = '🔄 リセット（異常ヘッダー）';
            return;
          }
          
          const isFast = (rxMode === 'fast' || rxMode === 'turbo');
          if (isFastFromHeader !== isFast) {
            log(`⚠️ ヘッダーモード(${isFastFromHeader?'高速':'正確'})が受信設定(${isFast?'高速':'正確'})と異なりますが継続します。`);
          }
          // 総ビット数 = ヘッダー(ヘッダー用繰り返し) + データ(データ用繰り返し)
          totalBits = (14 * headerRepeat) + (dataLen * 14 * dataRepeat);
          headerDecoded = true;
          headerDataLen = dataLen;
          log(`ヘッダー復号: データ長=${dataLen}バイト, 総ビット数=${totalBits}`);
          status.textContent = `📥 受信中... (${bitIndex}/${totalBits} ビット)`;
        }

        // ---- 全ビット受信完了 ----
        if (headerDecoded && bitStream.length >= totalBits && !receiveCompleted) {
          receiveCompleted = true;
          log(`受信完了 (${bitStream.length} ビット)`);
          clearInterval(receiveLoopId);
          receiveLoopId = null;
          mediaStream.getTracks().forEach(t => t.stop());
          mediaStream = null;
          isReceiving = false;
          document.getElementById('btnListen').disabled = false;
          document.getElementById('btnCancel').disabled = true;
          status.textContent = '✅ 受信完了';
          status.style.color = '#28a745';
          
          const validBits = bitStream.slice(0, totalBits);
          // ヘッダー部分とデータ部分で繰り返し回数が異なるので、デコード関数に渡す
          decodeStreamWithHeader(validBits, headerRepeat, dataRepeat);
          return;
        }
      }
    }
  }, 2);

  isReceiving = true;
};

// ---------- デコードユーティリティ (ヘッダーとデータで繰り返しが異なる場合に対応) ----------
function decodeBitsToByte(rawBits, repeat) {
  let voted = [];
  for (let i = 0; i < rawBits.length; i += repeat) {
    let sum = 0;
    for (let j = 0; j < repeat; j++) {
      sum += (i + j < rawBits.length) ? rawBits[i + j] : 0;
    }
    voted.push(sum >= repeat/2 ? 1 : 0);
  }
  if (voted.length < 14) return 0;
  const highCode = voted.slice(0, 7).reduce((acc, b) => (acc << 1) | b, 0);
  const lowCode  = voted.slice(7, 14).reduce((acc, b) => (acc << 1) | b, 0);
  return (decodeHamming(highCode) << 4) | decodeHamming(lowCode);
}

function decodeStreamWithHeader(bitStream, headerRepeat, dataRepeat) {
  const output = document.getElementById('outputText');
  const headerBitsLen = 14 * headerRepeat;
  const dataBitsPerByte = 14 * dataRepeat;

  if (bitStream.length < headerBitsLen) {
    log('❌ ビットストリームが短すぎます');
    output.textContent = 'データ不足';
    return;
  }

  // ヘッダー復号
  const headerRaw = bitStream.slice(0, headerBitsLen);
  const headerByte = decodeBitsToByte(headerRaw, headerRepeat);
  const dataLen = headerByte & 0x7F;
  log(`デコード: データ長=${dataLen}`);

  let bytes = [];
  for (let i = 0; i < dataLen; i++) {
    const offset = headerBitsLen + i * dataBitsPerByte;
    if (offset + dataBitsPerByte > bitStream.length) break;
    const raw = bitStream.slice(offset, offset + dataBitsPerByte);
    const b = decodeBitsToByte(raw, dataRepeat);
    bytes.push(b);
  }

  const hexStr = bytes.map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
  log(`受信バイト列 (Hex): ${hexStr}`);

  try {
    const decoder = new TextDecoder('utf-8', { fatal: false });
    const text = decoder.decode(new Uint8Array(bytes));
    if (text.includes('\uFFFD')) {
      log('⚠️ デコード中に置換文字(�)が含まれました (一部データが破損)');
    }
    log(`✅ 復元成功: "${text}"`);
    output.textContent = text || "(空文字列)";
  } catch(e) {
    log(`❌ デコードエラー: ${e.message}`);
    output.textContent = "デコードエラー";
  }
}

window.addEventListener('beforeunload', () => {
  if (isReceiving) stopReceive(false);
});
</script>
</body>
</html>
